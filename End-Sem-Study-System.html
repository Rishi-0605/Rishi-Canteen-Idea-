<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>End-Sem Master Study System</title>
<style>
  :root{
    --bg:#f3f4f8; --card:#ffffff; --border:#e2e5ee; --text:#1e2130; --muted:#6b7280;
    --primary:#4f46e5; --primary-dark:#3730a3; --primary-light:#eef0fd;
    --green:#16a34a; --green-bg:#dcfce7; --green-border:#86efac;
    --red:#dc2626; --red-bg:#fee2e2; --red-border:#fca5a5;
    --yellow:#ca8a04; --yellow-bg:#fef9c3;
    --easy:#16a34a; --moderate:#d97706; --difficult:#dc2626;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.5;padding-bottom:40px;}
  img{max-width:100%;}
  button{font-family:inherit;cursor:pointer;}
  .wrap{max-width:920px;margin:0 auto;padding:0 16px;}
  header.top{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;padding:14px 16px;box-shadow:0 2px 10px rgba(0,0,0,.12);}
  header.top .inner{max-width:920px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  header.top .brand{display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:800;font-size:1.05rem;}
  header.top .brand .logo{font-size:1.4rem;}
  header.top .chip{background:rgba(255,255,255,.18);border-radius:999px;padding:6px 14px;font-size:.82rem;font-weight:600;display:flex;align-items:center;gap:6px;}
  nav.crumbs{font-size:.85rem;color:var(--muted);margin:16px 0 6px;display:flex;flex-wrap:wrap;gap:4px;align-items:center;}
  nav.crumbs a{color:var(--primary);text-decoration:none;cursor:pointer;font-weight:600;}
  nav.crumbs a:hover{text-decoration:underline;}
  main{padding-top:6px;}
  h1{font-size:1.5rem;margin:8px 0 4px;}
  h2{font-size:1.2rem;margin:0 0 10px;}
  h3{font-size:1.02rem;margin:0 0 8px;}
  p{margin:0 0 10px;}
  .muted{color:var(--muted);}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:16px;box-shadow:0 1px 3px rgba(20,20,50,.04);}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--primary);color:#fff;border:none;border-radius:10px;padding:11px 18px;font-size:.95rem;font-weight:700;transition:transform .05s, background .15s;}
  .btn:hover{background:var(--primary-dark);}
  .btn:active{transform:scale(.98);}
  .btn.secondary{background:#fff;color:var(--primary);border:1.5px solid var(--primary);}
  .btn.secondary:hover{background:var(--primary-light);}
  .btn.ghost{background:transparent;color:var(--muted);border:1.5px solid var(--border);}
  .btn.green{background:var(--green);}
  .btn.green:hover{background:#15803d;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;}
  .progress-bar{background:#e5e7eb;border-radius:999px;height:10px;overflow:hidden;width:100%;}
  .progress-bar > div{background:linear-gradient(90deg,var(--primary),#818cf8);height:100%;border-radius:999px;transition:width .3s;}
  .progress-bar.thin{height:6px;}
  .subject-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;cursor:pointer;transition:box-shadow .15s, transform .1s;}
  .subject-card:hover{box-shadow:0 4px 16px rgba(20,20,60,.1);transform:translateY(-1px);}
  .subject-card .icon{font-size:1.8rem;}
  .subject-card .status{display:inline-block;font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:999px;margin-top:8px;}
  .status.notstarted{background:#f1f2f6;color:var(--muted);}
  .status.inprogress{background:var(--yellow-bg);color:var(--yellow);}
  .status.done{background:var(--green-bg);color:var(--green);}
  .status.pending{background:#fee2e2;color:#b91c1c;}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .chapter-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 14px;border:1px solid var(--border);border-radius:12px;margin-bottom:10px;cursor:pointer;background:#fff;}
  .chapter-item:hover{border-color:var(--primary);background:var(--primary-light);}
  .chapter-item .left{display:flex;align-items:center;gap:12px;}
  .chapter-item .num{width:30px;height:30px;border-radius:50%;background:var(--primary-light);color:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.85rem;flex-shrink:0;}
  .chapter-item.complete .num{background:var(--green-bg);color:var(--green);}
  .tag{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--primary-light);color:var(--primary);margin:0 4px 4px 0;}
  .tag.easy{background:#dcfce7;color:var(--easy);}
  .tag.moderate{background:#fef3c7;color:var(--moderate);}
  .tag.difficult{background:#fee2e2;color:var(--difficult);}
  .banner{background:var(--yellow-bg);border:1px solid #fde68a;border-radius:12px;padding:12px 14px;font-size:.88rem;margin-bottom:14px;}
  .banner.info{background:var(--primary-light);border-color:#c7d2fe;}
  .banner.demo{background:#ecfeff;border-color:#a5f3fc;}
  ul.clean{margin:0;padding-left:20px;}
  ul.clean li{margin-bottom:6px;}
  .section-title{font-size:.75rem;font-weight:800;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;margin:22px 0 10px;}
  /* MCQ */
  .qmeta{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px;}
  .qcounter{font-weight:800;color:var(--primary);letter-spacing:.03em;font-size:.85rem;}
  .qtext{font-size:1.12rem;font-weight:700;margin:6px 0 16px;}
  .option{display:flex;align-items:flex-start;gap:12px;border:1.5px solid var(--border);border-radius:12px;padding:13px 14px;margin-bottom:10px;background:#fff;transition:background .12s,border-color .12s;}
  .option.clickable{cursor:pointer;}
  .option.clickable:hover{border-color:var(--primary);background:var(--primary-light);}
  .option .bullet{font-weight:800;width:22px;flex-shrink:0;}
  .option.correct{background:var(--green-bg);border-color:var(--green-border);}
  .option.incorrect{background:var(--red-bg);border-color:var(--red-border);}
  .option .marker{margin-left:auto;font-weight:700;font-size:.85rem;white-space:nowrap;}
  .feedback{border-radius:12px;padding:16px;margin-top:16px;}
  .feedback.ok{background:var(--green-bg);border:1.5px solid var(--green-border);}
  .feedback.bad{background:var(--red-bg);border:1.5px solid var(--red-border);}
  .feedback h4{margin:0 0 8px;font-size:1.02rem;}
  .feedback .explain{background:rgba(255,255,255,.6);border-radius:10px;padding:12px;margin-top:10px;font-size:.92rem;}
  .feedback .explain h5{margin:0 0 6px;font-size:.82rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);}
  .whynot-item{margin-bottom:6px;font-size:.9rem;}
  /* Result dashboard */
  .result-hero{text-align:center;padding:26px 10px 10px;}
  .score-big{font-size:2.6rem;font-weight:900;color:var(--primary);}
  .stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0;}
  .stat-box{background:#fafafd;border:1px solid var(--border);border-radius:12px;padding:14px 8px;text-align:center;}
  .stat-box .num{font-size:1.4rem;font-weight:800;}
  .stat-box .lbl{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-top:2px;}
  .perf-badge{display:inline-block;font-weight:800;padding:6px 16px;border-radius:999px;margin-top:8px;font-size:.95rem;}
  /* Caselet */
  .case-text{background:#fafafd;border-left:4px solid var(--primary);border-radius:8px;padding:14px 16px;font-size:.95rem;white-space:pre-wrap;}
  textarea.answer-box{width:100%;min-height:110px;border:1.5px solid var(--border);border-radius:10px;padding:10px 12px;font-family:inherit;font-size:.92rem;resize:vertical;}
  textarea.answer-box:focus{outline:2px solid var(--primary);border-color:transparent;}
  .model-answer{background:#fdfdff;border:1px solid var(--border);border-radius:12px;padding:16px;margin-top:10px;}
  .model-answer h5{margin:14px 0 4px;font-size:.85rem;color:var(--primary-dark);text-transform:uppercase;letter-spacing:.03em;}
  .model-answer h5:first-child{margin-top:0;}
  .keypoints{background:var(--green-bg);border-radius:10px;padding:12px 14px;margin-top:12px;}
  .keypoints li{list-style:none;margin-bottom:5px;}
  .compare-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media (max-width:640px){.compare-cols{grid-template-columns:1fr;} .stat-grid{grid-template-columns:repeat(3,1fr);} }
  .divider{height:1px;background:var(--border);margin:16px 0;}
  footer.appfoot{max-width:920px;margin:30px auto 0;padding:0 16px;color:var(--muted);font-size:.78rem;text-align:center;}
  .icon-btn{background:none;border:none;color:var(--muted);font-size:1rem;padding:4px 8px;}
  .difficulty-dist{display:flex;gap:14px;margin:10px 0;flex-wrap:wrap;}
  .difficulty-dist .d-item{display:flex;align-items:center;gap:6px;font-size:.85rem;font-weight:600;}
  .dot{width:10px;height:10px;border-radius:50%;display:inline-block;}
  .locked-note{background:#f8f9fc;border:1px dashed var(--border);border-radius:12px;padding:16px;color:var(--muted);font-size:.9rem;text-align:center;}
</style>
</head>

/* ============================== UTIL ============================== */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function md(s){ if(!s) return ''; return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>'); }
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function fmtTime(ms){ const s=Math.round(ms/1000); const m=Math.floor(s/60); const ss=s%60; return m+':'+String(ss).padStart(2,'0'); }
function perfLabel(pct){
  if(pct>=85) return {label:'Excellent', color:'var(--green)', bg:'var(--green-bg)'};
  if(pct>=70) return {label:'Very Good', color:'var(--primary)', bg:'var(--primary-light)'};
  if(pct>=50) return {label:'Good — Revise Weak Areas', color:'var(--moderate)', bg:'#fef3c7'};
  return {label:'Needs Serious Revision', color:'var(--red)', bg:'var(--red-bg)'};
}
function diffColor(d){ return d==='easy'?'var(--easy)': d==='moderate'?'var(--moderate)':'var(--difficult)'; }
function diffTag(d){ return '<span class="tag '+d+'">'+ (d==='easy'?'🟢 Easy':d==='moderate'?'🟡 Moderate':'🔴 Difficult') +'</span>'; }
function letters(i){ return ['A','B','C','D'][i]; }

function findSubject(sid){ return SUBJECTS.find(s=>s.id===sid); }
function findChapter(sid,cid){ const s=findSubject(sid); return s? s.chapters.find(c=>c.id===cid): null; }
function findCaselet(sid,csid){ const s=findSubject(sid); return s? s.caselets.find(c=>c.id===csid): null; }

function subjectStats(s){
  const total = s.chapters.length;
  let done = 0;
  s.chapters.forEach(c=>{ const st = PROGRESS.subjects[s.id] && PROGRESS.subjects[s.id].chapters[c.id]; if(st && st.complete) done++; });
  const csTotal = s.caselets.length;
  let csDone = 0;
  s.caselets.forEach(cs=>{ const st = PROGRESS.subjects[s.id] && PROGRESS.subjects[s.id].caselets[cs.id]; if(st && st.completed) csDone++; });
  const hasContent = s.chapters.some(c=>c.mcqs.length>0);
  const overallUnits = total + csTotal;
  const overallDone = done + csDone;
  const pct = overallUnits? Math.round((overallDone/overallUnits)*100) : 0;
  return {total, done, csTotal, csDone, pct, hasContent};
}
function overallStats(){
  let unitsAll=0, doneAll=0;
  SUBJECTS.forEach(s=>{ const st=subjectStats(s); unitsAll += st.total+st.csTotal; doneAll += st.done+st.csDone; });
  return unitsAll? Math.round((doneAll/unitsAll)*100) : 0;
}

  return {view:'home'};
}

    html += '<div class="card locked-note">Caselets for this subject will be added once all chapters are built (10–12 large caselets, exam-style model answers). None yet — nothing to worry about, this comes after the chapters.</div>';
  } else {
    html += '<div class="card"><div class="row"><strong>Completed: '+st.csDone+' / '+st.csTotal+'</strong><span>'+Math.round((st.csDone/st.csTotal)*100)+'%</span></div>';
    html += '<div class="progress-bar thin" style="margin-top:8px"><div style="width:'+(st.csTotal? Math.round((st.csDone/st.csTotal)*100):0)+'%"></div></div>';
    html += '<div class="btn-row"><button class="btn" onclick="app.go(\'caselets\',{sid:\''+s.id+'\'})">Open Caselets →</button></div></div>';
  }
  return html;
}

/* ============================== RENDER: CHAPTER (study material) ============================== */
function renderChapter(s, c, isDemo){
  const sid = isDemo? null : s.id;
  const state = isDemo? ensureDemoChap() : ensureChap(sid, c.id);
  state.read = true; saveProgress();

  let html = '';
  if(isDemo) html += '<div class="banner demo">🧪 This is the sample chapter — safe to explore freely, it does not count toward any real subject\'s progress.</div>';
  html += '<h1>'+esc(c.title)+'</h1>';
  html += '<div style="margin-bottom:10px">'+c.topics.map(t=>'<span class="tag">'+esc(t)+'</span>').join('')+'</div>';

  if(!c.material){
    html += '<div class="card locked-note">📖 Study material for this chapter has not been added yet — it will appear here once notes for this subject are shared. Topics for this chapter are listed above so you know what to expect.</div>';
    html += '<div class="btn-row"><button class="btn secondary" onclick="history.back()">← Back</button></div>';
    return html;
  }

  const m = c.material;
  html += '<div class="card"><h2>📘 Overview</h2><p>'+md(m.overview)+'</p></div>';
  html += '<div class="card"><h2>🧩 Key Concepts</h2>';
  m.concepts.forEach(k=>{ html += '<div style="margin-bottom:12px"><strong>'+esc(k.term)+'</strong><p style="margin:4px 0 0">'+md(k.explanation)+'</p></div>'; });
  html += '</div>';
  html += '<div class="card"><h2>💡 Worked Examples</h2><ul class="clean">';
  m.examples.forEach(ex=>{ html += '<li>'+md(ex)+'</li>'; });
  html += '</ul></div>';
  html += '<div class="card"><h2>⚡ Quick Revision</h2><ul class="clean">';
  m.revision.forEach(r=>{ html += '<li>'+md(r)+'</li>'; });
  html += '</ul></div>';

  const hasMcqs = c.mcqs.length>0;
  html += '<div class="card">';
  html += '<div class="row"><h2 style="margin:0">📝 MCQ Test</h2>'+(state.best? '<span class="muted">Best: '+state.best.score+'/'+state.best.total+' ('+state.best.percent+'%)</span>':'')+'</div>';
  if(hasMcqs){
    const dist = {easy:0,moderate:0,difficult:0}; c.mcqs.forEach(q=>dist[q.difficulty]++);
    html += '<div class="difficulty-dist">';
    html += '<div class="d-item"><span class="dot" style="background:var(--easy)"></span>Easy '+dist.easy+'</div>';
    html += '<div class="d-item"><span class="dot" style="background:var(--moderate)"></span>Moderate '+dist.moderate+'</div>';
    html += '<div class="d-item"><span class="dot" style="background:var(--difficult)"></span>Difficult '+dist.difficult+'</div>';
    html += '</div>';
    html += '<div class="btn-row">';
    html += '<button class="btn" onclick="app.go(\''+(isDemo?'demo-mcq':'mcq')+'\',{sid:\''+(sid||'')+'\',cid:\''+c.id+'\'})">Start MCQ Test ('+c.mcqs.length+' Questions) →</button>';
    if(state.complete){ html += '<span class="status done" style="align-self:center">Chapter Complete ✅</span>'; }
    else if(state.attempts>0){ html += '<button class="btn green" onclick="app.markComplete(\''+(sid||'')+'\',\''+c.id+'\','+(isDemo?'true':'false')+')">Mark Chapter Complete ✅</button>'; }
    html += '</div>';
  } else {
    html += '<div class="locked-note">MCQs for this chapter will appear once notes are added.</div>';
  }
  html += '</div>';

  html += '<div class="btn-row"><button class="btn secondary" onclick="history.back()">← Back</button></div>';
  return html;
}

app.markComplete = function(sid, cid, isDemo){
  const state = isDemo? ensureDemoChap() : ensureChap(sid,cid);
  state.complete = true; saveProgress(); render();
};

/* ============================== MCQ TEST ENGINE ============================== */
function startTest(sid, c, isDemo){
  TEST = { sid, cid:c.id, isDemo, chapterTitle:c.title,
    questions: shuffle(c.mcqs.map((q,idx)=>({...q, _origIndex:idx}))),
    idx:0, answers:[], startTime:Date.now(), selected:null, locked:false };
}
function renderMcqScreen(s,c,isDemoFlag){
  const isDemo = isDemoFlag;
  const sid = isDemo? null : s.id;
  if(!TEST || TEST.cid!==c.id || TEST.isDemo!==isDemo){ startTest(sid,c,isDemo); }
  if(TEST.idx >= TEST.questions.length){ return renderMcqResult(sid,c,isDemo); }
  const q = TEST.questions[TEST.idx];
  let html = '<div class="card">';
  html += '<div class="qmeta"><span class="qcounter">QUESTION '+(TEST.idx+1)+' / '+TEST.questions.length+'</span>'+diffTag(q.difficulty)+'</div>';
  html += '<div class="qtext">'+esc(q.question || q.q)+'</div>';

  q.options.forEach((opt,i)=>{
    let cls = 'option';
    let marker = '';
    const bullet = ['A','B','C','D'][i];
    if(TEST.locked){
      cls += ' locked';
      if(i===q.correct){ cls+=' correct'; marker = '🟩 Correct Answer'; }
      else if(i===TEST.selected){ cls+=' incorrect'; marker = '🟥 Your Answer'; }
    } else {
      cls += ' clickable';
    }
    html += '<div class="'+cls+'" '+(TEST.locked?'':'onclick="app.selectOption('+i+')"')+'>';
    html += '<span class="bullet">'+bullet+'.</span><span>'+esc(opt)+'</span>';
    if(marker) html += '<span class="marker">'+marker+'</span>';
    html += '</div>';
  });

  if(TEST.locked){
    const correct = TEST.selected === q.correct;
    html += '<div class="feedback '+(correct?'ok':'bad')+'">';
    if(correct){
      html += '<h4>✅ CORRECT!</h4><p>Your answer: <strong>'+letters(TEST.selected)+'</strong></p>';
    } else {
      html += '<h4>❌ INCORRECT</h4>';
      html += '<p>🟥 Your Answer: <strong>'+letters(TEST.selected)+'</strong> — Incorrect<br>🟩 Correct Answer: <strong>'+letters(q.correct)+'</strong></p>';
    }
    html += '<div class="explain"><h5>Why?</h5><p>'+md(q.why)+'</p>';
    if(q.whyNot && Object.keys(q.whyNot).length){
      html += '<h5 style="margin-top:12px">Why not the others?</h5>';
      Object.keys(q.whyNot).sort().forEach(k=>{
        html += '<div class="whynot-item"><strong>'+letters(+k)+'</strong> — '+md(q.whyNot[k])+'</div>';
      });
    }
    html += '</div></div>';
    html += '<div class="btn-row">';
    html += '<button class="btn" onclick="app.nextQuestion()">'+(TEST.idx===TEST.questions.length-1?'Finish Test →':'Next Question →')+'</button>';
    html += '<button class="btn ghost" onclick="app.resetTest()">↺ Restart Test</button>';
    html += '</div>';
  }
  html += '</div>';
  return html;
}
app.selectOption = function(i){
  if(!TEST || TEST.locked) return;
  TEST.selected = i;
  TEST.locked = true;
  const q = TEST.questions[TEST.idx];
  TEST.answers.push({ qIndex:TEST.idx, selected:i, correct: i===q.correct });
  render();
};
app.nextQuestion = function(){
  if(!TEST) return;
  TEST.idx++; TEST.locked=false; TEST.selected=null;
  render();
};
app.resetTest = function(){
  if(!TEST) return;
  const sid = TEST.sid, cid = TEST.cid, isDemo = TEST.isDemo;
  const c = isDemo? DEMO_CHAPTER : findChapter(sid,cid);
  startTest(sid, c, isDemo);
  render();
};

function renderMcqResult(sid,c,isDemo){
  const total = TEST.questions.length;
  const correctCount = TEST.answers.filter(a=>a.correct).length;
  const wrongCount = total - correctCount;
  const percent = Math.round((correctCount/total)*100);
  const timeMs = Date.now() - TEST.startTime;
  const perf = perfLabel(percent);

  const state = isDemo? ensureDemoChap() : ensureChap(sid, c.id);
  state.attempts = (state.attempts||0)+1;
  state.last = { score:correctCount, total, percent, answers:TEST.answers, questions:TEST.questions, time:timeMs, date:Date.now() };
  if(!state.best || percent > state.best.percent){ state.best = { score:correctCount, total, percent }; }
  saveProgress();

  let html = '<div class="card result-hero">';
  html += '<div class="muted" style="letter-spacing:.1em;font-weight:800;font-size:.8rem">TEST COMPLETE</div>';
  html += '<div class="score-big">'+correctCount+' / '+total+'</div>';
  html += '<div class="muted">'+percent+'%</div>';
  html += '<div class="perf-badge" style="background:'+perf.bg+';color:'+perf.color+'">'+perf.label+'</div>';
  html += '<div class="stat-grid">';
  html += '<div class="stat-box"><div class="num" style="color:var(--green)">🟩 '+correctCount+'</div><div class="lbl">Correct</div></div>';
  html += '<div class="stat-box"><div class="num" style="color:var(--red)">🟥 '+wrongCount+'</div><div class="lbl">Wrong</div></div>';
  html += '<div class="stat-box"><div class="num">⏱ '+fmtTime(timeMs)+'</div><div class="lbl">Time Taken</div></div>';
  html += '</div>';
  html += '<div class="btn-row" style="justify-content:center">';
  html += '<button class="btn" onclick="app.go(\''+(isDemo?'demo-mcq':'mcq')+'\',{sid:\''+(sid||'')+'\',cid:\''+c.id+'\'});app.showReview=true;render();">📋 Review Answers</button>';
  html += '<button class="btn secondary" onclick="app.resetTest()">↺ Retake Test</button>';
  html += '<button class="btn ghost" onclick="'+(isDemo?"app.go('demo-chapter')":"app.go('chapter',{sid:'"+sid+"',cid:'"+c.id+"'})")+'">← Back to Chapter</button>';
  html += '</div></div>';

  if(app.showReview){
    html += '<div class="section-title">Review Answers</div>';
    TEST.questions.forEach((q,i)=>{
      const a = TEST.answers[i];
      html += '<div class="card"><div class="qmeta"><span class="qcounter">QUESTION '+(i+1)+'</span>'+diffTag(q.difficulty)+'</div>';
      html += '<div class="qtext" style="font-size:1rem">'+esc(q.question||q.q)+'</div>';
      html += '<p>'+(a.correct? '✅ Your Answer: <strong>'+letters(a.selected)+'</strong> — Correct' : '🟥 Your Answer: <strong>'+letters(a.selected)+'</strong> — Incorrect &nbsp;|&nbsp; 🟩 Correct Answer: <strong>'+letters(q.correct)+'</strong>')+'</p>';
      html += '<div class="explain"><h5>Explanation</h5><p>'+md(q.why)+'</p></div>';
      html += '</div>';
    });
    app.showReview = false;
  }
  return html;
}

/* ============================== CASELETS ============================== */
function renderCaseletList(s){
  const st = subjectStats(s);
  let html = '<h1>🎯 End-Sem Caselets — '+esc(s.name)+'</h1>';
  html += '<div class="card"><div class="row"><strong>Completed: '+st.csDone+' / '+st.csTotal+'</strong><span>'+(st.csTotal? Math.round((st.csDone/st.csTotal)*100):0)+'%</span></div>';
  html += '<div class="progress-bar" style="margin-top:8px"><div style="width:'+(st.csTotal? Math.round((st.csDone/st.csTotal)*100):0)+'%"></div></div></div>';
  s.caselets.forEach((cs,i)=>{
    const state = PROGRESS.subjects[s.id] && PROGRESS.subjects[s.id].caselets[cs.id];
    const done = state && state.completed;
    html += '<div class="chapter-item '+(done?'complete':'')+'" onclick="app.go(\'caselet\',{sid:\''+s.id+'\',csid:\''+cs.id+'\'})">';
    html += '<div class="left"><div class="num">'+(done?'✓':(i+1))+'</div><div><div style="font-weight:700">'+esc(cs.title)+'</div>';
    html += '<div class="muted" style="font-size:.8rem">'+cs.questions.length+' questions · '+cs.topics.join(', ')+'</div></div></div>';
    html += '<div>'+diffTag(cs.difficulty.toLowerCase())+'</div>';
    html += '</div>';
  });
  return html;
}

function renderCaseletDetail(s, cs, isDemo){
  const sid = isDemo? null : s.id;
  const state = isDemo? ensureDemoCaselet() : ensureCaselet(sid, cs.id);
  let html = '';
  if(isDemo) html += '<div class="banner demo">🧪 Sample caselet — try writing an answer, then reveal the model answer to compare.</div>';
  html += '<h1>'+esc(cs.title)+'</h1>';
  html += '<div style="margin:6px 0 14px">'+diffTag(cs.difficulty.toLowerCase())+' '+cs.topics.map(t=>'<span class="tag">'+esc(t)+'</span>').join('')+'</div>';
  html += '<div class="card"><h2>📄 Case</h2><div class="case-text">'+esc(cs.caseText)+'</div></div>';

  cs.questions.forEach((q,i)=>{
    const savedAns = state.answers['q'+i] || '';
    html += '<div class="card"><h3>QUESTION '+(i+1)+' <span class="muted" style="font-weight:500;font-size:.85rem">('+q.marks+' marks)</span></h3>';
    html += '<p>'+esc(q.text)+'</p>';
    html += '<label class="muted" style="font-size:.8rem;font-weight:700">YOUR ANSWER</label>';
    html += '<textarea class="answer-box" placeholder="Write your exam-style answer here..." onchange="app.saveCaseletAnswer(\''+(sid||'')+'\',\''+cs.id+'\','+(isDemo?'true':'false')+','+i+',this.value)">'+esc(savedAns)+'</textarea>';

    if(state.viewedModel){
      const a = q.answer;
      html += '<div class="model-answer"><h4 style="margin-top:0">✅ MODEL ANSWER</h4>';
      if(a.issue) html += '<h5>1. Identify the Issue</h5><p>'+md(a.issue)+'</p>';
      if(a.concept) html += '<h5>2. Relevant Concept / Theory</h5><p>'+md(a.concept)+'</p>';
      if(a.explanation) html += '<h5>3. Explanation</h5><p>'+md(a.explanation)+'</p>';
      if(a.application) html += '<h5>4. Application to the Case</h5><p>'+md(a.application)+'</p>';
      if(a.analysis) html += '<h5>5. Analysis</h5><p>'+md(a.analysis)+'</p>';
      if(a.recommendation) html += '<h5>6. Recommendation / Solution</h5><p>'+md(a.recommendation)+'</p>';
      if(a.conclusion) html += '<h5>7. Conclusion</h5><p>'+md(a.conclusion)+'</p>';
      if(a.keyPoints && a.keyPoints.length){
        html += '<div class="keypoints"><strong style="font-size:.82rem;text-transform:uppercase;color:var(--green)">Key Points You Should Have Included</strong><ul style="padding-left:4px;margin-top:8px">';
        a.keyPoints.forEach(k=>{ html += '<li>✓ '+esc(k)+'</li>'; });
        html += '</ul></div>';
      }
      html += '</div>';
    }
    html += '</div>';
  });

  html += '<div class="card">';
  if(!state.viewedModel){
    html += '<div class="btn-row"><button class="btn" onclick="app.showModelAnswers(\''+(sid||'')+'\',\''+cs.id+'\','+(isDemo?'true':'false')+')">🔓 Show Model Answers</button></div>';
    html += '<p class="muted" style="margin-top:10px;font-size:.85rem">Tip: try writing your own answer first — that\'s how real exam practice works. Model answers stay hidden until you click above.</p>';
  } else {
    html += '<div class="status done" style="display:inline-block">Caselet marked complete ✅</div>';
  }
  html += '<div class="btn-row"><button class="btn secondary" onclick="'+(isDemo?"app.go('home')":"app.go('caselets',{sid:'"+sid+"'})")+'">← Back</button></div>';
  html += '</div>';
  return html;
}
app.saveCaseletAnswer = function(sid, csid, isDemo, qi, val){
  const state = isDemo? ensureDemoCaselet() : ensureCaselet(sid,csid);
  state.answers['q'+qi] = val;
  saveProgress();
};
app.showModelAnswers = function(sid, csid, isDemo){
  const state = isDemo? ensureDemoCaselet() : ensureCaselet(sid,csid);
  state.viewedModel = true; state.completed = true;
  saveProgress(); render();
};

/* Attach demo data as a caselet on a virtual subject for list rendering re-use (not shown in real subjects) */

/* ============================== INIT ============================== */
render();
</script>
