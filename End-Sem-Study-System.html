  { id:'cs12', title:'Metro Wheels Cab Service — The Full Marketing Plan', difficulty:'Difficult (End-Sem Level)',
    topics:['Marketing Concept','Consumer Behaviour','STP','Product/Service Strategy','Pricing'],
    caseText:`Metro Wheels is a new intra-city cab service launching in a mid-sized Indian city currently served only by unorganized local taxis and one dominant national ride-hailing app. Metro Wheels' founders want to build the company "the right way" — starting from genuine customer needs rather than simply copying the market leader. Early research shows two distinct rider groups: daily office commuters who care most about predictable pricing and punctuality, and occasional airport/outstation travellers who care most about comfort, safety, and professional drivers. The national ride-hailing app currently uses surge (dynamic) pricing that commuters frequently complain about on social media. Metro Wheels has limited vehicles and driver-partners at launch and cannot serve every segment well from day one. The founders have asked you to design their complete go-to-market approach.`,
    questions:[
      { marks:2, text:'Which marketing management philosophy should Metro Wheels adopt as its guiding approach, and why?',
        answer:{ issue:'Metro Wheels should adopt the **Marketing concept** — an "outside-in" philosophy starting from genuine customer needs rather than simply copying competitors.', concept:'This matches the founders\' explicit intent to build "the right way," starting from customer needs.', keyPoints:['Correctly identifies the Marketing concept','Links it to the founders\' stated intent']}},
      { marks:4, text:'Using consumer behaviour concepts, briefly profile what likely drives the daily office commuter segment versus the occasional airport traveller segment.',
        answer:{
          issue:"The two rider segments are driven by different combinations of Personal and Psychological factors, which Metro Wheels must understand to serve each well.",

          application:"This explains why commuters are highly sensitive to Metro Wheels' single biggest differentiator opportunity — predictable pricing — while occasional travellers will weight service quality/safety credentials more heavily than price.",
          recommendation:"Metro Wheels should tailor its messaging: reliability/predictability for commuters, comfort/safety credentials for occasional travellers.",
          conclusion:"Treating both segments with one undifferentiated message would undersell the specific driver that matters most to each."
        , keyPoints:['Correctly applies distinct behavioural reasoning to each segment','Uses at least one named consumer-behaviour concept per segment']}},
      { marks:5, text:'Recommend a targeting strategy for Metro Wheels at launch, given its limited vehicles and driver-partners.',
        answer:{
          issue:"Metro Wheels cannot serve both the commuter and occasional-traveller segments well simultaneously with its limited launch resources.",
          concept:"Targeting strategy options are Undifferentiated, Differentiated, Concentrated/Niche, and Micro Marketing.",
          explanation:"Concentrated/Niche Marketing is specifically recommended when resources are limited, allowing a company to build deep specialization in one segment rather than spreading itself thin across several.",
          application:"Given limited vehicle/driver capacity, Metro Wheels should NOT attempt Differentiated Marketing across both segments at launch. The daily-commuter segment offers more predictable, recurring demand (useful for planning limited driver capacity efficiently) and directly addresses the clearest gap in the market — dissatisfaction with the incumbent's surge pricing.",
          recommendation:"Launch with Concentrated/Niche Marketing focused on daily office commuters, addressing the specific unmet need for predictable pricing and punctuality, before expanding capacity to serve occasional airport/outstation travellers as a second phase.",

        answer:{
          issue:"Metro Wheels has a clear opportunity to position against the incumbent's most visible weakness — unpredictable surge pricing — but must translate this into both a positioning statement and a coherent pricing strategy.",

          application:"POD: 'No-surprise, flat-rate pricing for your daily commute' — Desirable (directly addresses a proven complaint), Deliverable (achievable via a fixed-fare model for regular commuter routes), Differentiating (the incumbent's core model relies on dynamic surge pricing, which it's unlikely to abandon). Positioning statement: *'For daily office commuters tired of unpredictable surge pricing, Metro Wheels is the cab service that guarantees a flat, predictable fare every time — because your commute shouldn't be a gamble.'* On pricing: adopt a **Survival/Maximum Market Share** objective at launch (given it's a new entrant needing to build a rider base fast), using a form of Everyday Low / flat-rate pricing (not EDLP in the retail sense, but the SPIRIT of consistent, non-surging pricing) as the core method — explicitly the opposite of the incumbent's High-Low/surge approach.",

      { marks:9, text:'As Metro Wheels\' founding marketing consultant, integrate all of the above into ONE coherent go-to-market strategy memo covering philosophy, target segment, positioning, product/service design, and pricing — and explain how you would evolve the strategy after the first 12 months.',

        , keyPoints:['Integrates philosophy, STP, consumer behaviour, service design and pricing into ONE coherent narrative','Explicitly proposes a 12-month evolution/expansion plan','Ties every element back to the central "reliability" positioning idea','Full exam-style structure: issue, concept, explanation, application, analysis, recommendation, conclusion']}},

const STORAGE_KEY = 'essms_progress_v1';
function loadProgress(){
  try{ const raw = localStorage.getItem(STORAGE_KEY); return raw? JSON.parse(raw) : {subjects:{}, demo:{}}; }
  catch(e){ return {subjects:{}, demo:{}}; }
}
function saveProgress(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(PROGRESS)); }catch(e){} }
let PROGRESS = loadProgress();
function ensureSubj(sid){ if(!PROGRESS.subjects[sid]) PROGRESS.subjects[sid] = {chapters:{}, caselets:{}}; return PROGRESS.subjects[sid]; }
function ensureChap(sid,cid){ const s=ensureSubj(sid); if(!s.chapters[cid]) s.chapters[cid] = {read:false, complete:false, attempts:0, best:null, last:null}; return s.chapters[cid]; }
function ensureCaselet(sid,csid){ const s=ensureSubj(sid); if(!s.caselets[csid]) s.caselets[csid] = {answers:{}, viewedModel:false, completed:false}; return s.caselets[csid]; }
function ensureDemoChap(){ if(!PROGRESS.demo.chapter) PROGRESS.demo.chapter = {read:false, complete:false, attempts:0, best:null, last:null}; return PROGRESS.demo.chapter; }
function ensureDemoCaselet(){ if(!PROGRESS.demo.caselet) PROGRESS.demo.caselet = {answers:{}, viewedModel:false, completed:false}; return PROGRESS.demo.caselet; }

/* ============================== UTIL ============================== */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function md(s){ if(!s) return ''; return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>').replace(/\n/g,'<br>'); }
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function fmtTime(ms){ const s=Math.round(ms/1000); const m=Math.floor(s/60); const ss=s%60; return m+':'+String(ss).padStart(2,'0'); }
function perfLabel(pct){
  if(pct>=85) return {label:'Excellent', color:'var(--green)', bg:'var(--green-bg)'};
  if(pct>=70) return {label:'Very Good', color:'var(--primary)', bg:'var(--primary-light)'};
  if(pct>=50) return {label:'Good — Revise Weak Areas', color:'var(--moderate)', bg:'#fef3c7'};
  return {label:'Needs Serious Revision', color:'var(--red)', bg:'var(--red-bg)'};
}
function diffColor(d){ return d==='easy'?'var(--easy)': d==='moderate'?'var(--moderate)':'var(--difficult)'; }
function diffTag(d){ return '<span class="tag '+d+'">'+ (d==='easy'?'🟢 Easy':d==='moderate'?'🟡 Moderate':'🔴 Difficult') +'</span>'; }
function letters(i){ return ['A','B','C','D'][i]; }

function findSubject(sid){ return SUBJECTS.find(s=>s.id===sid); }
function findChapter(sid,cid){ const s=findSubject(sid); return s? s.chapters.find(c=>c.id===cid): null; }
function findCaselet(sid,csid){ const s=findSubject(sid); return s? s.caselets.find(c=>c.id===csid): null; }

function subjectStats(s){
  const total = s.chapters.length;
  let done = 0;
  s.chapters.forEach(c=>{ const st = PROGRESS.subjects[s.id] && PROGRESS.subjects[s.id].chapters[c.id]; if(st && st.complete) done++; });
  const csTotal = s.caselets.length;
  let csDone = 0;
  s.caselets.forEach(cs=>{ const st = PROGRESS.subjects[s.id] && PROGRESS.subjects[s.id].caselets[cs.id]; if(st && st.completed) csDone++; });
  const hasContent = s.chapters.some(c=>c.mcqs.length>0);
  const overallUnits = total + csTotal;
  const overallDone = done + csDone;
  const pct = overallUnits? Math.round((overallDone/overallUnits)*100) : 0;
  return {total, done, csTotal, csDone, pct, hasContent};
}
function overallStats(){
  let unitsAll=0, doneAll=0;
  SUBJECTS.forEach(s=>{ const st=subjectStats(s); unitsAll += st.total+st.csTotal; doneAll += st.done+st.csDone; });
  return unitsAll? Math.round((doneAll/unitsAll)*100) : 0;
}

function parseHash(){
  const h = location.hash.replace(/^#\/?/, '');
  const parts = h.split('/').filter(Boolean);
  if(parts.length===0) return {view:'home'};
  const view = parts[0];
  if(view==='subject') return {view, sid:parts[1]};
  if(view==='chapter') return {view, sid:parts[1], cid:parts[2]};
  if(view==='mcq') return {view, sid:parts[1], cid:parts[2]};
  if(view==='caselets') return {view, sid:parts[1]};
  if(view==='caselet') return {view, sid:parts[1], csid:parts[2]};
  if(view==='demo-chapter') return {view};
  if(view==='demo-mcq') return {view};
  if(view==='demo-caselet') return {view};
  return {view:'home'};
}

  params = params || {};

  if(params.sid) hash += '/'+params.sid;
  if(params.cid) hash += '/'+params.cid;
  if(params.csid) hash += '/'+params.csid;
  location.hash = hash;
};

/* ============================== MCQ TEST ENGINE ============================== */
function startTest(sid, c, isDemo){
  TEST = { sid, cid:c.id, isDemo, chapterTitle:c.title,
    questions: shuffle(c.mcqs.map((q,idx)=>({...q, _origIndex:idx}))),
    idx:0, answers:[], startTime:Date.now(), selected:null, locked:false };
}
function renderMcqScreen(s,c,isDemoFlag){
  const isDemo = isDemoFlag;
  const sid = isDemo? null : s.id;
  if(!TEST || TEST.cid!==c.id || TEST.isDemo!==isDemo){ startTest(sid,c,isDemo); }
  if(TEST.idx >= TEST.questions.length){ return renderMcqResult(sid,c,isDemo); }
  const q = TEST.questions[TEST.idx];
  let html = '<div class="card">';
  html += '<div class="qmeta"><span class="qcounter">QUESTION '+(TEST.idx+1)+' / '+TEST.questions.length+'</span>'+diffTag(q.difficulty)+'</div>';
  html += '<div class="qtext">'+esc(q.question || q.q)+'</div>';

  q.options.forEach((opt,i)=>{
    let cls = 'option';
    let marker = '';
    const bullet = ['A','B','C','D'][i];
    if(TEST.locked){
      cls += ' locked';
      if(i===q.correct){ cls+=' correct'; marker = '🟩 Correct Answer'; }
      else if(i===TEST.selected){ cls+=' incorrect'; marker = '🟥 Your Answer'; }
    } else {
      cls += ' clickable';
    }
    html += '<div class="'+cls+'" '+(TEST.locked?'':'onclick="app.selectOption('+i+')"')+'>';
    html += '<span class="bullet">'+bullet+'.</span><span>'+esc(opt)+'</span>';
    if(marker) html += '<span class="marker">'+marker+'</span>';
    html += '</div>';
  });

  if(TEST.locked){
    const correct = TEST.selected === q.correct;
    html += '<div class="feedback '+(correct?'ok':'bad')+'">';
    if(correct){
      html += '<h4>✅ CORRECT!</h4><p>Your answer: <strong>'+letters(TEST.selected)+'</strong></p>';
    } else {
      html += '<h4>❌ INCORRECT</h4>';
      html += '<p>🟥 Your Answer: <strong>'+letters(TEST.selected)+'</strong> — Incorrect<br>🟩 Correct Answer: <strong>'+letters(q.correct)+'</strong></p>';
    }
    html += '<div class="explain"><h5>Why?</h5><p>'+md(q.why)+'</p>';
    if(q.whyNot && Object.keys(q.whyNot).length){
      html += '<h5 style="margin-top:12px">Why not the others?</h5>';
      Object.keys(q.whyNot).sort().forEach(k=>{
        html += '<div class="whynot-item"><strong>'+letters(+k)+'</strong> — '+md(q.whyNot[k])+'</div>';
      });
    }
    html += '</div></div>';
    html += '<div class="btn-row">';
    html += '<button class="btn" onclick="app.nextQuestion()">'+(TEST.idx===TEST.questions.length-1?'Finish Test →':'Next Question →')+'</button>';
    html += '<button class="btn ghost" onclick="app.resetTest()">↺ Restart Test</button>';
    html += '</div>';
  }
  html += '</div>';
  return html;
}
app.selectOption = function(i){
  if(!TEST || TEST.locked) return;
  TEST.selected = i;
  TEST.locked = true;
  const q = TEST.questions[TEST.idx];
  TEST.answers.push({ qIndex:TEST.idx, selected:i, correct: i===q.correct });
  render();
};
app.nextQuestion = function(){
  if(!TEST) return;
  TEST.idx++; TEST.locked=false; TEST.selected=null;
  render();
};
app.resetTest = function(){
  if(!TEST) return;
  const sid = TEST.sid, cid = TEST.cid, isDemo = TEST.isDemo;
  const c = isDemo? DEMO_CHAPTER : findChapter(sid,cid);
  startTest(sid, c, isDemo);
  render();
};

function renderMcqResult(sid,c,isDemo){
  const total = TEST.questions.length;
  const correctCount = TEST.answers.filter(a=>a.correct).length;
  const wrongCount = total - correctCount;
  const percent = Math.round((correctCount/total)*100);
  const timeMs = Date.now() - TEST.startTime;
  const perf = perfLabel(percent);

  const state = isDemo? ensureDemoChap() : ensureChap(sid, c.id);
  state.attempts = (state.attempts||0)+1;
  state.last = { score:correctCount, total, percent, answers:TEST.answers, questions:TEST.questions, time:timeMs, date:Date.now() };
  if(!state.best || percent > state.best.percent){ state.best = { score:correctCount, total, percent }; }
  saveProgress();

  let html = '<div class="card result-hero">';
  html += '<div class="muted" style="letter-spacing:.1em;font-weight:800;font-size:.8rem">TEST COMPLETE</div>';
  html += '<div class="score-big">'+correctCount+' / '+total+'</div>';
  html += '<div class="muted">'+percent+'%</div>';
  html += '<div class="perf-badge" style="background:'+perf.bg+';color:'+perf.color+'">'+perf.label+'</div>';
  html += '<div class="stat-grid">';
  html += '<div class="stat-box"><div class="num" style="color:var(--green)">🟩 '+correctCount+'</div><div class="lbl">Correct</div></div>';
  html += '<div class="stat-box"><div class="num" style="color:var(--red)">🟥 '+wrongCount+'</div><div class="lbl">Wrong</div></div>';
  html += '<div class="stat-box"><div class="num">⏱ '+fmtTime(timeMs)+'</div><div class="lbl">Time Taken</div></div>';
  html += '</div>';
  html += '<div class="btn-row" style="justify-content:center">';
  html += '<button class="btn" onclick="app.go(\''+(isDemo?'demo-mcq':'mcq')+'\',{sid:\''+(sid||'')+'\',cid:\''+c.id+'\'});app.showReview=true;render();">📋 Review Answers</button>';
  html += '<button class="btn secondary" onclick="app.resetTest()">↺ Retake Test</button>';
  html += '<button class="btn ghost" onclick="'+(isDemo?"app.go('demo-chapter')":"app.go('chapter',{sid:'"+sid+"',cid:'"+c.id+"'})")+'">← Back to Chapter</button>';
  html += '</div></div>';

  if(app.showReview){
    html += '<div class="section-title">Review Answers</div>';
    TEST.questions.forEach((q,i)=>{
      const a = TEST.answers[i];
      html += '<div class="card"><div class="qmeta"><span class="qcounter">QUESTION '+(i+1)+'</span>'+diffTag(q.difficulty)+'</div>';
      html += '<div class="qtext" style="font-size:1rem">'+esc(q.question||q.q)+'</div>';
      html += '<p>'+(a.correct? '✅ Your Answer: <strong>'+letters(a.selected)+'</strong> — Correct' : '🟥 Your Answer: <strong>'+letters(a.selected)+'</strong> — Incorrect &nbsp;|&nbsp; 🟩 Correct Answer: <strong>'+letters(q.correct)+'</strong>')+'</p>';
      html += '<div class="explain"><h5>Explanation</h5><p>'+md(q.why)+'</p></div>';
      html += '</div>';
    });
    app.showReview = false;
  }
  return html;
}

/* ============================== CASELETS ============================== */
function renderCaseletList(s){
  const st = subjectStats(s);
  let html = '<h1>🎯 End-Sem Caselets — '+esc(s.name)+'</h1>';
  html += '<div class="card"><div class="row"><strong>Completed: '+st.csDone+' / '+st.csTotal+'</strong><span>'+(st.csTotal? Math.round((st.csDone/st.csTotal)*100):0)+'%</span></div>';
  html += '<div class="progress-bar" style="margin-top:8px"><div style="width:'+(st.csTotal? Math.round((st.csDone/st.csTotal)*100):0)+'%"></div></div></div>';
  s.caselets.forEach((cs,i)=>{
    const state = PROGRESS.subjects[s.id] && PROGRESS.subjects[s.id].caselets[cs.id];
    const done = state && state.completed;
    html += '<div class="chapter-item '+(done?'complete':'')+'" onclick="app.go(\'caselet\',{sid:\''+s.id+'\',csid:\''+cs.id+'\'})">';
    html += '<div class="left"><div class="num">'+(done?'✓':(i+1))+'</div><div><div style="font-weight:700">'+esc(cs.title)+'</div>';
    html += '<div class="muted" style="font-size:.8rem">'+cs.questions.length+' questions · '+cs.topics.join(', ')+'</div></div></div>';
    html += '<div>'+diffTag(cs.difficulty.toLowerCase())+'</div>';
    html += '</div>';
  });
  return html;
}

function renderCaseletDetail(s, cs, isDemo){
  const sid = isDemo? null : s.id;
  const state = isDemo? ensureDemoCaselet() : ensureCaselet(sid, cs.id);
  let html = '';
  if(isDemo) html += '<div class="banner demo">🧪 Sample caselet — try writing an answer, then reveal the model answer to compare.</div>';
  html += '<h1>'+esc(cs.title)+'</h1>';
  html += '<div style="margin:6px 0 14px">'+diffTag(cs.difficulty.toLowerCase())+' '+cs.topics.map(t=>'<span class="tag">'+esc(t)+'</span>').join('')+'</div>';
  html += '<div class="card"><h2>📄 Case</h2><div class="case-text">'+esc(cs.caseText)+'</div></div>';

  cs.questions.forEach((q,i)=>{
    const savedAns = state.answers['q'+i] || '';
    html += '<div class="card"><h3>QUESTION '+(i+1)+' <span class="muted" style="font-weight:500;font-size:.85rem">('+q.marks+' marks)</span></h3>';
    html += '<p>'+esc(q.text)+'</p>';
    html += '<label class="muted" style="font-size:.8rem;font-weight:700">YOUR ANSWER</label>';
    html += '<textarea class="answer-box" placeholder="Write your exam-style answer here..." onchange="app.saveCaseletAnswer(\''+(sid||'')+'\',\''+cs.id+'\','+(isDemo?'true':'false')+','+i+',this.value)">'+esc(savedAns)+'</textarea>';

    if(state.viewedModel){
      const a = q.answer;
      html += '<div class="model-answer"><h4 style="margin-top:0">✅ MODEL ANSWER</h4>';
      if(a.issue) html += '<h5>1. Identify the Issue</h5><p>'+md(a.issue)+'</p>';
      if(a.concept) html += '<h5>2. Relevant Concept / Theory</h5><p>'+md(a.concept)+'</p>';
      if(a.explanation) html += '<h5>3. Explanation</h5><p>'+md(a.explanation)+'</p>';
      if(a.application) html += '<h5>4. Application to the Case</h5><p>'+md(a.application)+'</p>';
      if(a.analysis) html += '<h5>5. Analysis</h5><p>'+md(a.analysis)+'</p>';
      if(a.recommendation) html += '<h5>6. Recommendation / Solution</h5><p>'+md(a.recommendation)+'</p>';
      if(a.conclusion) html += '<h5>7. Conclusion</h5><p>'+md(a.conclusion)+'</p>';
      if(a.keyPoints && a.keyPoints.length){
        html += '<div class="keypoints"><strong style="font-size:.82rem;text-transform:uppercase;color:var(--green)">Key Points You Should Have Included</strong><ul style="padding-left:4px;margin-top:8px">';
        a.keyPoints.forEach(k=>{ html += '<li>✓ '+esc(k)+'</li>'; });
        html += '</ul></div>';
      }
      html += '</div>';
    }
    html += '</div>';
  });

  html += '<div class="card">';
  if(!state.viewedModel){
    html += '<div class="btn-row"><button class="btn" onclick="app.showModelAnswers(\''+(sid||'')+'\',\''+cs.id+'\','+(isDemo?'true':'false')+')">🔓 Show Model Answers</button></div>';
    html += '<p class="muted" style="margin-top:10px;font-size:.85rem">Tip: try writing your own answer first — that\'s how real exam practice works. Model answers stay hidden until you click above.</p>';
  } else {
    html += '<div class="status done" style="display:inline-block">Caselet marked complete ✅</div>';
  }
  html += '<div class="btn-row"><button class="btn secondary" onclick="'+(isDemo?"app.go('home')":"app.go('caselets',{sid:'"+sid+"'})")+'">← Back</button></div>';
  html += '</div>';
  return html;
}
app.saveCaseletAnswer = function(sid, csid, isDemo, qi, val){
  const state = isDemo? ensureDemoCaselet() : ensureCaselet(sid,csid);
  state.answers['q'+qi] = val;
  saveProgress();
};
app.showModelAnswers = function(sid, csid, isDemo){
  const state = isDemo? ensureDemoCaselet() : ensureCaselet(sid,csid);
  state.viewedModel = true; state.completed = true;
  saveProgress(); render();
};

/* Attach demo data as a caselet on a virtual subject for list rendering re-use (not shown in real subjects) */

/* ============================== INIT ============================== */
render();
</script>
