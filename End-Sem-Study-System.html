<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>End-Sem Master Study System</title>
<style>
  :root{
    --bg:#f3f4f8; --card:#ffffff; --border:#e2e5ee; --text:#1e2130; --muted:#6b7280;
    --primary:#4f46e5; --primary-dark:#3730a3; --primary-light:#eef0fd;
    --green:#16a34a; --green-bg:#dcfce7; --green-border:#86efac;
    --red:#dc2626; --red-bg:#fee2e2; --red-border:#fca5a5;
    --yellow:#ca8a04; --yellow-bg:#fef9c3;
    --easy:#16a34a; --moderate:#d97706; --difficult:#dc2626;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.5;padding-bottom:40px;}
  img{max-width:100%;}
  button{font-family:inherit;cursor:pointer;}
  .wrap{max-width:920px;margin:0 auto;padding:0 16px;}
  header.top{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;padding:14px 16px;box-shadow:0 2px 10px rgba(0,0,0,.12);}
  header.top .inner{max-width:920px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  header.top .brand{display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:800;font-size:1.05rem;}
  header.top .brand .logo{font-size:1.4rem;}
  header.top .chip{background:rgba(255,255,255,.18);border-radius:999px;padding:6px 14px;font-size:.82rem;font-weight:600;display:flex;align-items:center;gap:6px;}
  nav.crumbs{font-size:.85rem;color:var(--muted);margin:16px 0 6px;display:flex;flex-wrap:wrap;gap:4px;align-items:center;}
  nav.crumbs a{color:var(--primary);text-decoration:none;cursor:pointer;font-weight:600;}
  nav.crumbs a:hover{text-decoration:underline;}
  main{padding-top:6px;}
  h1{font-size:1.5rem;margin:8px 0 4px;}
  h2{font-size:1.2rem;margin:0 0 10px;}
  h3{font-size:1.02rem;margin:0 0 8px;}
  p{margin:0 0 10px;}
  .muted{color:var(--muted);}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:16px;box-shadow:0 1px 3px rgba(20,20,50,.04);}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--primary);color:#fff;border:none;border-radius:10px;padding:11px 18px;font-size:.95rem;font-weight:700;transition:transform .05s, background .15s;}
  .btn:hover{background:var(--primary-dark);}
  .btn:active{transform:scale(.98);}
  .btn.secondary{background:#fff;color:var(--primary);border:1.5px solid var(--primary);}
  .btn.secondary:hover{background:var(--primary-light);}
  .btn.ghost{background:transparent;color:var(--muted);border:1.5px solid var(--border);}
  .btn.green{background:var(--green);}
  .btn.green:hover{background:#15803d;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;}
  .progress-bar{background:#e5e7eb;border-radius:999px;height:10px;overflow:hidden;width:100%;}
  .progress-bar > div{background:linear-gradient(90deg,var(--primary),#818cf8);height:100%;border-radius:999px;transition:width .3s;}
  .progress-bar.thin{height:6px;}
  .subject-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;cursor:pointer;transition:box-shadow .15s, transform .1s;}
  .subject-card:hover{box-shadow:0 4px 16px rgba(20,20,60,.1);transform:translateY(-1px);}
  .subject-card .icon{font-size:1.8rem;}
  .subject-card .status{display:inline-block;font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:999px;margin-top:8px;}
  .status.notstarted{background:#f1f2f6;color:var(--muted);}
  .status.inprogress{background:var(--yellow-bg);color:var(--yellow);}
  .status.done{background:var(--green-bg);color:var(--green);}
  .status.pending{background:#fee2e2;color:#b91c1c;}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .chapter-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 14px;border:1px solid var(--border);border-radius:12px;margin-bottom:10px;cursor:pointer;background:#fff;}
  .chapter-item:hover{border-color:var(--primary);background:var(--primary-light);}
  .chapter-item .left{display:flex;align-items:center;gap:12px;}
  .chapter-item .num{width:30px;height:30px;border-radius:50%;background:var(--primary-light);color:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.85rem;flex-shrink:0;}
  .chapter-item.complete .num{background:var(--green-bg);color:var(--green);}
  .tag{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--primary-light);color:var(--primary);margin:0 4px 4px 0;}
  .tag.easy{background:#dcfce7;color:var(--easy);}
  .tag.moderate{background:#fef3c7;color:var(--moderate);}
  .tag.difficult{background:#fee2e2;color:var(--difficult);}
  .banner{background:var(--yellow-bg);border:1px solid #fde68a;border-radius:12px;padding:12px 14px;font-size:.88rem;margin-bottom:14px;}
  .banner.info{background:var(--primary-light);border-color:#c7d2fe;}
  .banner.demo{background:#ecfeff;border-color:#a5f3fc;}
  ul.clean{margin:0;padding-left:20px;}
  ul.clean li{margin-bottom:6px;}
  .section-title{font-size:.75rem;font-weight:800;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;margin:22px 0 10px;}
  /* MCQ */
  .qmeta{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px;}
  .qcounter{font-weight:800;color:var(--primary);letter-spacing:.03em;font-size:.85rem;}
  .qtext{font-size:1.12rem;font-weight:700;margin:6px 0 16px;}
  .option{display:flex;align-items:flex-start;gap:12px;border:1.5px solid var(--border);border-radius:12px;padding:13px 14px;margin-bottom:10px;background:#fff;transition:background .12s,border-color .12s;}
  .option.clickable{cursor:pointer;}
  .option.clickable:hover{border-color:var(--primary);background:var(--primary-light);}
  .option .bullet{font-weight:800;width:22px;flex-shrink:0;}
  .option.correct{background:var(--green-bg);border-color:var(--green-border);}
  .option.incorrect{background:var(--red-bg);border-color:var(--red-border);}
  .option .marker{margin-left:auto;font-weight:700;font-size:.85rem;white-space:nowrap;}
  .feedback{border-radius:12px;padding:16px;margin-top:16px;}
  .feedback.ok{background:var(--green-bg);border:1.5px solid var(--green-border);}
  .feedback.bad{background:var(--red-bg);border:1.5px solid var(--red-border);}
  .feedback h4{margin:0 0 8px;font-size:1.02rem;}
  .feedback .explain{background:rgba(255,255,255,.6);border-radius:10px;padding:12px;margin-top:10px;font-size:.92rem;}
  .feedback .explain h5{margin:0 0 6px;font-size:.82rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);}
  .whynot-item{margin-bottom:6px;font-size:.9rem;}
  /* Result dashboard */
  .result-hero{text-align:center;padding:26px 10px 10px;}
  .score-big{font-size:2.6rem;font-weight:900;color:var(--primary);}
  .stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0;}
  .stat-box{background:#fafafd;border:1px solid var(--border);border-radius:12px;padding:14px 8px;text-align:center;}
  .stat-box .num{font-size:1.4rem;font-weight:800;}
  .stat-box .lbl{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-top:2px;}
  .perf-badge{display:inline-block;font-weight:800;padding:6px 16px;border-radius:999px;margin-top:8px;font-size:.95rem;}
  /* Caselet */
  .case-text{background:#fafafd;border-left:4px solid var(--primary);border-radius:8px;padding:14px 16px;font-size:.95rem;white-space:pre-wrap;}
  textarea.answer-box{width:100%;min-height:110px;border:1.5px solid var(--border);border-radius:10px;padding:10px 12px;font-family:inherit;font-size:.92rem;resize:vertical;}
  textarea.answer-box:focus{outline:2px solid var(--primary);border-color:transparent;}
  .model-answer{background:#fdfdff;border:1px solid var(--border);border-radius:12px;padding:16px;margin-top:10px;}
  .model-answer h5{margin:14px 0 4px;font-size:.85rem;color:var(--primary-dark);text-transform:uppercase;letter-spacing:.03em;}
  .model-answer h5:first-child{margin-top:0;}
  .keypoints{background:var(--green-bg);border-radius:10px;padding:12px 14px;margin-top:12px;}
  .keypoints li{list-style:none;margin-bottom:5px;}
  .compare-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media (max-width:640px){.compare-cols{grid-template-columns:1fr;} .stat-grid{grid-template-columns:repeat(3,1fr);} }
  .divider{height:1px;background:var(--border);margin:16px 0;}
  footer.appfoot{max-width:920px;margin:30px auto 0;padding:0 16px;color:var(--muted);font-size:.78rem;text-align:center;}
  .icon-btn{background:none;border:none;color:var(--muted);font-size:1rem;padding:4px 8px;}
  .difficulty-dist{display:flex;gap:14px;margin:10px 0;flex-wrap:wrap;}
  .difficulty-dist .d-item{display:flex;align-items:center;gap:6px;font-size:.85rem;font-weight:600;}
  .dot{width:10px;height:10px;border-radius:50%;display:inline-block;}
  .locked-note{background:#f8f9fc;border:1px dashed var(--border);border-radius:12px;padding:16px;color:var(--muted);font-size:.9rem;text-align:center;}
</style>
</head>

  { id:'ism', icon:'💻', name:'Information Systems for Managers', chapters:[
    {id:'ch1', title:'Information System Concepts & IT Infrastructure', topics:['Data vs Information, Attributes of Information Quality','IT infrastructure: H/W, S/W, Network resources','Computer networks: LAN, WAN, MAN, Internet, Intranet, Extranet']},
    {id:'ch2', title:'Introduction to Organizational Systems', topics:['Types of Information Systems','Classification by organizational levels','TPS, MIS, EIS, DSS, ES']},

/* ---------------- OB SUBJECT CONTENT (built from official course PPT notes) ---------------- */
(function(){
  const ob = SUBJECTS.find(s=>s.id==='ob');
  function setCh(id, material, mcqs){ const c = ob.chapters.find(c=>c.id===id); c.material = material; c.mcqs = mcqs; }

  /* ===================== CH1: Individual Learning & Behaviour ===================== */
  setCh('ch1', {
    overview: "**Learning** is the acquisition of knowledge and skills through study, practice and experience. Fred Luthans defines it as *a relatively permanent change in behaviour that occurs as a result of experience or reinforced practice*; Stephen Robbins gives a near-identical definition. Three major theories explain how learning happens: **Classical Conditioning** (learning by association), **Operant Conditioning** (learning by consequences), and **Social Learning Theory** (learning by observation).",
    concepts:[
      {term:'Classical Conditioning (Pavlov)', explanation:"States that behaviour is learned through repetitive association between a stimulus and a response — 'learning by association'. Key elements: Unconditioned Stimulus (naturally triggers a response), Unconditioned Response (the natural reaction), Conditioned Stimulus (a neutral stimulus that becomes linked to the unconditioned stimulus), Conditioned Response (the learned reaction to the conditioned stimulus). Applications include Generalization, Discrimination, Extinction and Speedy Recovery."},
      {term:'Operant Conditioning (Skinner)', explanation:"Says people repeat responses that are rewarded and stop responses that are not rewarded or are punished — behaviour is voluntary and is shaped by its consequences."},
      {term:'Consequences of Reinforcement', explanation:"**Positive Reinforcement** — a reward that increases a desired behaviour. **Negative Reinforcement** — removing something unpleasant, which also increases a desired behaviour. **Punishment** — decreases undesired behaviour (Positive punishment = adding something unpleasant; Negative punishment = removing something pleasant). **Extinction** — a behaviour decreases because no consequence follows it at all."},
      {term:'Schedules of Reinforcement', explanation:"Continuous (reward every time — fast learning), Fixed Interval (average, regular performance), Variable Interval (moderately high, stable performance), Fixed Ratio (high, stable performance), Variable Ratio (very high performance — e.g. commission-based sales)."},
      {term:'Social Learning Theory (Bandura)', explanation:"People learn by observing others: they form a mental image of the behaviour, then reproduce it. Models can be Actual, Verbal or Symbolic. The 4 steps of modelling behaviour are: Attention → Retention → Reproduction → Motivation."},
    ],
    examples:[

    concepts:[

      {term:'Job Satisfaction vs Job Involvement vs Organizational Commitment', explanation:"Job Satisfaction (Locke) = a pleasurable emotional state from appraising one's job. Job Involvement = the degree to which an employee invests time/energy in the job and sees it as central to their self-image. Organizational Commitment = the degree of identification with, and loyalty to, the organization as a whole."},

      {term:'Cognitive Dissonance', explanation:"Experienced when a person holds two or more contradictory beliefs, ideas or values, or when behaviour is inconsistent with belief — creating uncomfortable tension. Reduced by: changing the behaviour, changing the conflicting cognition, adding a new justifying cognition, or ignoring the conflicting information."},
      {term:"Hofstede's Cultural Dimensions", explanation:"Individualism vs Collectivism (loose ties vs strong group identity); Power Distance (acceptability of unequal power); Uncertainty Avoidance (comfort with ambiguity); Masculinity vs Femininity (competition/achievement vs relationships/quality of life); Long-term vs Short-term Orientation (future-oriented thrift vs tradition); Restraint vs Indulgence (controlled vs free gratification of desires)."},

  /* ===================== CH3: Perception ===================== */
  setCh('ch3', {
    overview: "**Perception** refers to the view or impression an individual has about objects, events and people's behaviour. Stephen Robbins defines it as *the process by which individuals organize and interpret their sensory impressions in order to give meaning to their environment*. Perception is shaped by Internal factors (needs, personality, experience) and External factors (size, intensity, repetition, contrast, movement). **Attribution Theory** explains how we decide whether someone's behaviour is caused by internal or external factors, and this feeds directly into how managers make decisions — either through the idealised **Rational Model** or the more realistic **Bounded Rationality (Herbert Simon)**. Good decisions should also be filtered through an **ethical lens**.",
    concepts:[
      {term:'Attribution Theory', explanation:"Explains the process of deciding whether an observed behaviour is caused by internal factors (the person) or external factors (the situation), guided by three rules: **Distinctiveness** (High → External, Low → Internal), **Consensus** (High → External, Low → Internal), and **Consistency** (High → Internal, Low → External)."},
      {term:'Fundamental Attribution Error & Self-Serving Bias', explanation:"Fundamental Attribution Error = underestimating external factors and overestimating internal factors when judging OTHERS. Self-Serving Bias = attributing our OWN success to internal factors and our own failures to external factors."},
      {term:'Errors in Perception', explanation:"Stereotyping, Halo Effect, Attribution errors, Selective Perception, Impression Management, and the Pygmalion & Golem Effect (people rise or fall to others' expectations of them) are common distortions in how we perceive people."},
      {term:'Rational Decision-Making Model', explanation:"Assumes the decision-maker is systematic, objective, has complete information, clear goals, can evaluate all alternatives, and chooses the optimum solution. In reality this is rarely fully achievable."},
      {term:'Bounded Rationality (Herbert Simon)', explanation:"Recognises that managers cannot be fully rational due to limits of time, information and money. Simon called this **'Satisficing'** — choosing a course of action that is 'good enough', not the theoretically best one."},
      {term:'Ethical Decision-Making Lenses', explanation:"Utilitarian Lens (produces the most good, least harm for the most stakeholders), Rights Lens (respects the rights of all stakeholders), Justice Lens (treats people fairly, giving each what they are due)."},
    ],
    examples:[

    ],

  /* ===================== CH5: Emotional Intelligence ===================== */
  setCh('ch5', {
    overview: "**Emotional Intelligence (EI)** is the ability to adaptively recognize, express, regulate and harness emotions. Salovey & Mayer define it as *an ability to monitor one's own and others' feelings and emotions, to discriminate among them, and to use this information to guide one's thinking and actions*. EI is built from four components: **Self-Awareness**, **Self-Regulation**, **Social Awareness**, and **Social Skills**.",
    concepts:[
      {term:'Self-Awareness', explanation:"Emotional Self-Awareness (knowing your own feelings), Accurate Self-Assessment (understanding your strengths/weaknesses and their effects), Self-Confidence (having faith in yourself)."},
      {term:'Social Awareness', explanation:"Empathy (forming connections, understanding others' emotions), Service Orientation (being helpful, a good listener), Organizational Awareness (sensing how well you're understood by others)."},
      {term:'Self-Regulation', explanation:"Emotional Self-Control, Achievement orientation, Initiative, Transparency (honesty/integrity), Adaptability (resilience), Optimism."},
      {term:'Social Skills', explanation:"Inspirational Leadership, Influence, Conflict Management, Change Catalyst, Developing Others, Teamwork & Collaboration."},
      {term:'EI and Organizational Behaviour', explanation:"High EI helps employees perform difficult/stressful tasks, self-regulate emotions, experience less job burnout, build team spirit through social awareness, maintain better superior-subordinate relationships, and reduce group conflict."},

    examples:[

      "A team leader notices a stressed colleague, listens patiently, and adjusts their workload → Empathy / Service Orientation (Social Awareness).",
      "An employee stays calm and composed during a stressful client escalation, channelling the situation constructively → Emotional Self-Control (Self-Regulation).",
    ],
    revision:[
      "EI = ability to recognize, express, regulate and harness emotions (Salovey & Mayer).",

  /* ===================== CH6: Motivation ===================== */
  setCh('ch6', {
    overview: "Michael Jucious defines **Motivation** as *the act of stimulating someone or oneself to get a desired course of action*. Motivation theories fall into two types: **Content theories** — what motivates people (Maslow's Hierarchy, McGregor's Theory X & Y, Herzberg's Two-Factor Theory) — and **Process theories** — how motivation happens (Skinner's Reinforcement Theory, Self-Efficacy, Adams' Equity Theory, Locke's Goal-Setting Theory). Organizations apply these through **techniques of motivation** such as Job Redesign and MBO.",
    concepts:[
      {term:"Maslow's Hierarchy of Needs", explanation:"A pyramid of five need levels, from basic Physiological needs at the bottom, through Safety, Social/Belonging, Esteem, up to Self-Actualization at the top. Lower needs generally must be reasonably satisfied before higher ones motivate behaviour."},
      {term:"McGregor's Theory X & Theory Y", explanation:"Theory X assumes people are inherently lazy, avoid responsibility, and need close control (favouring centralization). Theory Y assumes people are self-motivated, seek responsibility and are creative (favouring decentralization and flexible leadership)."},
      {term:"Herzberg's Two-Factor Theory", explanation:"Hygiene factors (salary, company policy, working conditions) prevent dissatisfaction but don't by themselves motivate. Motivator factors (recognition, achievement, growth) are what actually create satisfaction and drive motivation."},
      {term:'Monetary vs Non-Monetary Motivation Factors', explanation:"Monetary: salaries, bonus, incentives, special incentives. Non-monetary: status & security, appreciation, delegation, working conditions, job enrichment."},
      {term:"Adams' Equity Theory", explanation:"People compare their own input-outcome ratio to that of others (referents). Under OVER-equity they may work harder or discount the reward (internal responses) or encourage others to seek more / change their referent (external responses). Under UNDER-equity they may lower productivity, inflate the reward's value in their mind, bargain for more/quit, or change their referent."},
      {term:"Locke's Goal-Setting Theory", explanation:"Motivation and performance improve when goals have: Acceptance & Commitment, Specificity, Result-orientation, appropriate Challenge, and ongoing Performance Monitoring & Feedback."},
      {term:'Techniques of Motivation', explanation:"Job Redesign — Job Enlargement (adding more tasks of the same level/difficulty — horizontal) and Job Enrichment (adding responsibility, autonomy and depth — vertical). MBO (Management By Objectives) — collectively formulating goals and action plans, evaluating and selecting the best plan, implementing it, and collectively monitoring performance."},
    ],
    examples:[
      "If salary doubled, ranking spending priorities from food/house (basic needs) to recognition/luxury (higher needs) mirrors Maslow's Hierarchy.",
      "A manager who believes employees are lazy and need constant supervision is applying Theory X; one who trusts employees to take initiative is applying Theory Y.",
      "An employee feels under-rewarded versus a colleague and quietly reduces effort → Under-equity, Internal-Physical response (Adams' Equity Theory).",
      "A sales team given a specific, challenging, mutually accepted target with regular feedback outperforms a team told to just 'do their best' → Locke's Goal-Setting Theory.",
    ],
    revision:[
      'Motivation = act of stimulating someone to get a desired course of action (Jucious).',
      'Content theories = WHAT motivates (Maslow, Theory X & Y, Herzberg). Process theories = HOW motivation happens (Equity, Goal-Setting, Self-Efficacy).',
      'Maslow: Physiological → Safety → Social → Esteem → Self-Actualization.',
      'Theory X = people are lazy, need control; Theory Y = people are self-motivated, seek responsibility.',
      'Herzberg: Hygiene factors prevent dissatisfaction; Motivator factors create real motivation.',
      "Equity Theory = comparing own input/outcome ratio to others'.",
      'Goal-Setting: specific + challenging + accepted + feedback > vague goals.',
      'Job Enlargement = MORE tasks, same level; Job Enrichment = MORE responsibility/depth.',
      'MBO = collective goal-setting, planning, implementation and monitoring.',
    ]
  }, [
    {difficulty:'easy', q:"Michael Jucious defines motivation as:", options:["A fixed personality trait","The act of stimulating someone (or oneself) to get a desired course of action","A method of measuring job performance","A type of organizational structure"], correct:1,
      why:"Jucious's definition specifically frames motivation as the act of stimulating a person to produce a desired course of action — 'pushing the right button' to get the desired reaction.",
      whyNot:{0:"Motivation is described as an active process/act, not a fixed trait.",2:"Performance measurement is a separate management activity, not the definition of motivation.",3:"Organizational structure is unrelated to this definition of motivation."}},
    {difficulty:'easy', q:"Maslow's Hierarchy of Needs is generally represented as a pyramid moving from:", options:["Self-actualization down to physiological needs, in reverse order of importance","Basic physiological needs at the bottom to self-actualization at the top","A random, unordered list of needs","Only monetary needs to non-monetary needs"], correct:1,
      why:"Maslow's pyramid starts with basic physiological needs at the bottom and rises through safety, social, esteem, up to self-actualization at the top.",
      whyNot:{0:"The order runs bottom-to-top starting with physiological needs, not top-to-bottom from self-actualization.",2:"The needs are arranged in a specific hierarchical order, not randomly.",3:"Maslow's needs include social, esteem and self-actualization needs, not just a monetary/non-monetary split."}},
    {difficulty:'moderate', q:"According to McGregor, a manager who believes employees are inherently lazy, dislike responsibility, and must be closely controlled is operating under:", options:["Theory Y","Theory X","Herzberg's hygiene theory","Equity Theory"], correct:1,
      why:"Theory X specifically assumes employees are inherently lazy, avoid responsibility, and require close control and direction.",
      whyNot:{0:"Theory Y assumes the opposite — that employees are self-motivated and seek responsibility.",2:"Herzberg's theory concerns hygiene vs motivator factors in the job, not assumptions about human nature.",3:"Equity Theory concerns fairness comparisons, not assumptions about whether employees are lazy or responsible."}},
    {difficulty:'moderate', q:"According to Herzberg's Two-Factor Theory, which of the following is a MOTIVATOR factor (not a hygiene factor)?", options:["Salary","Company policy","Recognition and achievement","Working conditions"], correct:2,

      why:"Adams' Equity Theory describes how people respond to perceived under-equity, including lowering their own productivity (an internal, physical/behavioural response) to restore a sense of fairness.",
      whyNot:{0:"Herzberg's theory concerns hygiene/motivator job factors, not fairness comparisons with others.",2:"Locke's theory concerns how goals are set, not fairness/equity comparisons.",3:"Maslow's theory concerns a hierarchy of needs, not comparisons between people's input-outcome ratios."}},

      whyNot:{0:"Adding more same-level tasks describes Job Enlargement, a horizontal expansion, not enrichment.",2:"Reducing tasks would shrink the job, which is the opposite of enrichment.",3:"Rotating between identical jobs doesn't add depth or responsibility, so it isn't enrichment."}},
    {difficulty:'difficult', q:"A company gives its sales team a specific, challenging, mutually accepted target with regular feedback check-ins, instead of a vague 'do your best' instruction, and performance improves. This best illustrates:", options:["Herzberg's hygiene factors","Locke's Goal-Setting Theory","Theory X","Adams' Equity Theory (over-equity)"], correct:1,
      why:"Locke's Goal-Setting Theory shows that specific, challenging, accepted goals with feedback lead to significantly higher performance than vague instructions.",
      whyNot:{0:"Hygiene factors relate to job context like pay and conditions, not to how targets/goals are framed.",2:"Theory X is about assumptions of laziness needing control, unrelated to goal specificity.",3:"Equity Theory concerns fairness comparisons between people, not the specificity of a given target."}},
    {difficulty:'difficult', q:"An organization forms teams to collectively set goals, jointly create action plans, evaluate alternatives together, and collectively monitor performance against objectives. This describes:", options:["Job enlargement","MBO (Management by Objectives)","The Halo Effect","Bounded rationality"], correct:1,
      why:"MBO (Management By Objectives) is exactly this process: collectively formulating goals and action plans, evaluating alternatives, selecting the best plan, implementing it, and collectively monitoring performance.",
      whyNot:{0:"Job enlargement is about adding more same-level tasks to an individual's job, unrelated to collective goal-setting.",2:"The Halo Effect is a perception error about judging people, unrelated to this management technique.",3:"Bounded rationality is a decision-making concept about limited information, not a goal-setting technique."}},

  /* ===================== CH7: Groups and Teams ===================== */
  setCh('ch7', {
    overview: "According to Bartol and Martin, a **Group** is *two or more independent individuals who interact and influence each other in collective pursuit of a common goal*. Groups can be Formal (Command groups, Task groups) or Informal (Friendship groups, Interest groups). A **Team**, per Katzenbach and Smith, is *a small number of people with complementary skills who are committed to a common purpose, set of performance goals, and approach for which they hold themselves mutually accountable*. Team effectiveness depends on Work Design, Composition, Context and Process. Groups typically develop through the **Five-Stage Model** (Forming → Storming → Norming → Performing → Adjourning) or, for deadline-driven groups, the **Punctuated Equilibrium Model**.",
    concepts:[
      {term:'Types of Groups', explanation:"Small & Large, Primary & Secondary, Formal & Informal, Temporary & Permanent. Formal groups = Command group & Task group. Informal groups = Friendship group & Interest group."},
      {term:'Groups vs Teams', explanation:"Groups: a strong individual leader, individual accountability, individual work products, efficient meetings. Teams: shared leadership, individual AND mutual accountability, collective work products, open-ended discussion & active problem-solving."},
      {term:'Team Effectiveness Factors', explanation:"Work Design (skill variety, task identity, task significance, autonomy); Composition (abilities, personality, roles/diversity, flexibility, preferences); Context (adequate resources, leadership, climate of trust, rewards); Process (common purpose, specific goals, team efficacy, conflict levels, social loafing)."},
      {term:'Stages of Group Development', explanation:"Five-Stage Model: Forming (getting acquainted) → Storming (conflict over roles/leadership) → Norming (norms established, cohesion builds) → Performing (fully functional, task-focused) → Adjourning (group disbands). Punctuated Equilibrium Model: deadline-driven groups show a period of relative inertia, then a sharp 'midpoint transition' where approach changes significantly, followed by a final burst of activity."},
      {term:'Group Decision-Making', explanation:"Advantages: new ideas, cooperation, commitment, shared responsibility, fewer costly errors, higher productivity. Disadvantages: slower decisions, domination by a few, costly, compromised decisions, diffused responsibility. Techniques: Committee meetings, Brainstorming, Delphi Technique, Nominal Group Technique, Decision Tree, Quality Circles, Game Theory."},
    ],
    examples:[
      "A task force set up specifically to complete one project → a Formal (Task) group.",
      "A group of employees who informally have lunch together every day → an Informal (Friendship) group.",
      "A project team that works slowly at first, then dramatically shifts its approach at the halfway point before finishing with a burst of activity → Punctuated Equilibrium Model.",
      "A company collects anonymous written ideas from all members, then has them silently vote to rank the ideas → Nominal Group Technique.",
    ],
    revision:[
      'Group (Bartol & Martin) = 2+ interdependent individuals pursuing a common goal.',

    {difficulty:'difficult', q:"A company wants structured, anonymous idea generation from a group without the dominance of vocal members, followed by silent voting to rank ideas. Which technique of group decision-making is most appropriate?", options:["Committee meeting","Nominal Group Technique","Game theory","Decision tree"], correct:1,

      {term:'PESTLE Analysis', explanation:"Political (govt stability, business policies, trade agreements), Economic (inflation, interest rates, unemployment), Social (culture, religion, workforce diversity), Technological (innovation, R&D, internet infrastructure), Legal (antitrust laws, patent laws, foreign investment laws), Environmental (climate sensitivity, environmental protection laws). Purpose: identify current and future external factors, and exploit opportunities or defend against threats better than competitors."},
      {term:'Fad vs Trend vs Megatrend', explanation:"Fad: weeks to a few years, hard to predict, short-term opportunity (e.g. fidget spinners). Trend: several years, more predictable, medium-term planning (e.g. health-conscious eating). Megatrend: 10-50+ years, highly predictable, long-term structural transformation (e.g. digitalization, sustainability)."},
      {term:"Porter's Five Forces", explanation:"Threat of New Entrants (depends on entry barriers like economies of scale, capital requirements, switching costs, and expected retaliation), Bargaining Power of Suppliers (high when few large suppliers, no substitutes, critical/high-switching-cost goods), Bargaining Power of Buyers (high when buyers purchase large volumes or products are undifferentiated), Threat of Substitutes (high when switching costs are low and substitutes are cheaper/equally good), Rivalry Among Existing Competitors (intense when competitors are numerous, growth is slow, fixed/exit costs are high, and differentiation is low). High entry barriers + weak supplier/buyer power + few substitutes + moderate rivalry = an attractive, high-profit-potential industry."},

    concepts:[
      {term:'Mission Statement Questions & Qualities', explanation:"Good strategic planning starts by asking: What is our business? Who is the customer? What is of value to the customer? What will/should our business be? Good mission statements focus on a limited number of goals, stress major policies/values, define competitive spheres, take a long-term view, and stay short and memorable."},
      {term:'SBU & BCG (Growth-Share) Matrix', explanation:"A Strategic Business Unit (SBU) can be a company division, product line, or single product/brand. The BCG Matrix plots SBUs on Relative Market Share (low/high) vs Market Growth Rate (low/high): **Stars** (high share, high growth — big cash generators AND users), **Cash Cows** (high share, low growth — generate cash cheaply, get 'milked'), **Question Marks** (low share, high growth — consume cash, uncertain future, 'problem children'), **Dogs** (low share, low growth — cash traps, usually divested). Strategic choices for each SBU: Build, Hold, Harvest, or Divest."},
      {term:"Ansoff's Product/Market Expansion Grid", explanation:"Market Penetration (existing product, existing market — increase sales to current customers), Product Development (new product, existing market), Market Development (existing product, new market), Diversification (new product, new market — the riskiest, since it involves two unknowns)."},
      {term:"Porter's Generic Competitive Strategies", explanation:"Cost Leadership (broad target, competing on being the lowest-cost producer), Differentiation (broad target, competing on unique, valued attributes that can command a premium price), Focus Strategy (narrow/niche target, pursuing either a cost or a differentiation advantage within that niche)."},
      {term:'Market Position & Entry-Timing Roles', explanation:"By market share: Market Leader (largest share, studied/followed by others), Market Challenger (attacks the leader), Market Follower (stays in its niche, avoids risk). By entry timing: Pioneer (first-mover), Close Follower (enters soon after), Late Follower (enters late, often at a lower price)."},
      {term:'Managing the Marketing Effort', explanation:"Requires Marketing Implementation, Marketing Control, and Marketing Audits. Marketing ROI = the net return from a marketing investment divided by the cost of that investment."},
    ],
    examples:[
      "A high-share, high-growth SBU that needs continuous heavy investment to defend its lead is a Star; a high-share, low-growth SBU that funds the rest of the business cheaply is a Cash Cow.",
      "A toothpaste company selling more toothpaste to its EXISTING customers via a loyalty scheme is Market Penetration; the same company launching in a new country with its EXISTING toothpaste is Market Development.",
      "Colgate is a Market Leader in toothpaste; Close-up is a Market Challenger that directly took on Colgate; Vicco Vajradanti is a Market Follower content with its niche.",
      "McDonald's-Coca-Cola and Pizza Hut-Pepsi are examples of strategic Product Alliances.",
    ],
    revision:[
      'Strategic Planning = fit between org goals/capabilities and changing marketing opportunities.',
      'BCG Matrix axes: Relative Market Share × Market Growth Rate → Stars, Cash Cows, Question Marks, Dogs.',
      'SBU strategic choices: Build, Hold, Harvest, Divest.',
      "Ansoff: Market Penetration, Product Development, Market Development, Diversification (riskiest).",
      "Porter's generic strategies: Cost Leadership (broad, low-cost), Differentiation (broad, unique), Focus (narrow niche).",
      'Market roles: Leader, Challenger, Follower, Nicher; Entry-timing: Pioneer, Close Follower, Late Follower.',
      'Marketing ROI = net return from marketing investment ÷ cost of that investment.',
    ]
  }, [
    {difficulty:'easy', q:"Strategic Planning is best defined as:", options:["The process of developing and maintaining a strategic fit between the organization's goals/capabilities and its changing marketing opportunities","The process of setting daily sales targets","The process of hiring new salespeople","A one-time annual budgeting exercise"], correct:0,
      why:"Strategic planning is specifically about maintaining a strategic FIT between what the organization can do (goals/capabilities) and the opportunities in its changing environment.",
      whyNot:{1:"Setting daily sales targets is an operational, not strategic, activity.",2:"Hiring salespeople is an HR/staffing activity, not strategic planning.",3:"Strategic planning is an ongoing process, not a one-time annual budget exercise."}},
    {difficulty:'easy', q:"In the BCG (Growth-Share) Matrix, a business with HIGH market share and HIGH market growth rate is called a:", options:["Cash Cow","Dog","Star","Question Mark"], correct:2,
      why:"A Star has both high relative market share and a high market growth rate — it's a leader in a fast-growing market.",
      whyNot:{0:"A Cash Cow has high share but LOW growth, not high growth.",1:"A Dog has low share and low growth, the opposite of a Star.",3:"A Question Mark has low share (despite high growth), not high share."}},
    {difficulty:'moderate', q:"A business with LOW market share in a low-growth, aging industry, generating negative cash flows, is best classified in the BCG matrix as a:", options:["Star","Cash Cow","Question Mark","Dog"], correct:3,
      why:"Dogs have low market share in a low-growth (aged) industry and are described as 'cash traps' that generate negative cash flows — usually candidates for divestment.",
      whyNot:{0:"Stars have high share and high growth, the opposite of this description.",1:"Cash Cows have high share, not low share, and generate positive cash at low cost.",2:"Question Marks are in high-growth markets, not low-growth/aging ones."}},
    {difficulty:'moderate', q:"'Cash Cows' in the BCG matrix are typically businesses with:", options:["High growth, low market share","Low growth, high market share","Low growth, low market share","High growth, high market share"], correct:1,
      why:"Cash Cows have high relative market share in a low-growth market — they're 'yesterday's stars', generating substantial cash at low investment cost.",
      whyNot:{0:"High growth with low share describes a Question Mark, not a Cash Cow.",2:"Low growth with low share describes a Dog, not a Cash Cow.",3:"High growth with high share describes a Star, not a Cash Cow."}},
    {difficulty:'moderate', q:"According to Ansoff's Matrix, selling an existing product to an entirely new geographic market is an example of:", options:["Market Penetration","Product Development","Market Development","Diversification"], correct:2,
      why:"Market Development means taking an EXISTING product into a NEW market (such as a new geography or new customer segment).",
      whyNot:{0:"Market Penetration keeps both product and market the SAME, focusing on selling more to existing customers.",1:"Product Development means launching a NEW product into an EXISTING market — the reverse of this scenario.",3:"Diversification requires BOTH a new product and a new market, not just a new market."}},
    {difficulty:'moderate', q:"According to Ansoff's Matrix, launching a completely new product for a completely new market is called:", options:["Market Penetration","Diversification","Product Development","Market Development"], correct:1,
      why:"Diversification means offering new products in new markets — it is considered the riskiest Ansoff strategy since it involves two unknowns simultaneously.",
      whyNot:{0:"Market Penetration involves no new product or market at all.",2:"Product Development involves a new product but an EXISTING market, not a new one.",3:"Market Development involves a new market but an EXISTING product, not a new one."}},
    {difficulty:'moderate', q:"A firm following Porter's Cost Leadership strategy primarily targets:", options:["A narrow niche with a unique/differentiated product","A broad, industry-wide market with a low-cost advantage","A narrow niche with a low-cost advantage","A broad market with a highly differentiated, premium product"], correct:1,
      why:"Cost Leadership targets a broad, industry-wide market and competes by becoming the lowest-cost producer, especially effective where customers are price sensitive.",
      whyNot:{0:"A narrow niche with differentiation describes a Focus strategy (differentiation variant), not Cost Leadership.",2:"A narrow niche with low cost describes a Focus strategy (cost variant), not broad Cost Leadership.",3:"A broad market with a premium/differentiated product describes the Differentiation strategy, not Cost Leadership."}},
    {difficulty:'moderate', q:"In a market, the firm with the largest market share whose strategies are studied and followed by others is called the:", options:["Market Nicher","Market Challenger","Market Leader","Market Follower"], correct:2,
      why:"The Market Leader has the largest share and a proven track record that other firms — academics and followers alike — study and try to emulate.",
      whyNot:{0:"A Nicher/Concentrated player serves a small specialized segment, not the overall market leader position.",1:"A Challenger actively attacks the leader's position rather than being the one with the largest share.",3:"A Follower stays in its own niche and avoids risk rather than leading the market."}},
    {difficulty:'difficult', q:"A toothpaste brand has low market share and operates in a slow-growing, mature toothpaste category, generating minimal cash. Strategic analysis suggests the firm should sell it off unless there is clear untapped potential. This business unit is a BCG:", options:["Star, and the firm should 'Build'","Question Mark, and the firm should invest more","Dog, and the firm should likely 'Divest'","Cash Cow, and the firm should 'Harvest'"], correct:2,
      why:"Low market share in a low-growth (mature) market, generating minimal/negative cash, is the definition of a Dog — and the typical strategic response is to Divest, unless further analysis reveals real hidden potential.",
      whyNot:{0:"A Star would have HIGH market share and high growth, not low share in a mature category.",1:"A Question Mark would be in a HIGH-growth market, not a slow-growing mature one.",3:"A Cash Cow would have HIGH market share, not low share as described here."}},
    {difficulty:'difficult', q:"Marketing ROI is best defined as:", options:["Total sales revenue for the year","The net return from a marketing investment divided by the cost of the marketing investment","The total marketing budget for the year","Customer satisfaction score"], correct:1,
      why:"Marketing ROI specifically measures efficiency: the net return generated by a marketing investment, divided by what that investment cost — not simply revenue or budget size.",
      whyNot:{0:"Total sales revenue doesn't account for how much was spent to generate it.",2:"The marketing budget is just the cost side, not a measure of the return generated.",3:"Customer satisfaction is a different, non-financial metric, not what Marketing ROI measures."}},
  ]);

  /* ===================== CH4: Consumer Markets and Consumer Buyer Behavior ===================== */
  setCh('ch4', {
    overview: "Consumer Buying Behaviour is *the process and activities people engage in when searching for, selecting, purchasing, using, evaluating, and disposing of products and services so as to satisfy their needs and wants*. This behaviour is shaped by **Cultural**, **Social**, **Personal** and **Psychological** factors, follows a predictable **Buyer Decision Process**, and — for genuinely new products — an **Adoption Process** that different types of adopters move through at different speeds.",
    concepts:[
      {term:'Cultural Factors', explanation:"Culture (the most basic determinant of a person's wants/behaviour, learned via socialization), Subculture (nationalities, religions, racial groups, geographic regions sharing a value system), Social Class (hierarchically ordered strata sharing values/behaviour; India uses Socio-Economic Classification (SEC): A1 = highest urban purchase potential down to E2; rural uses R1-R4)."},
      {term:'Social Factors', explanation:"Reference Groups (Membership, Primary/Secondary, Aspirational, Dissociative groups), Family (Family of Orientation = parents/siblings, shaping religion/politics/self-worth orientation; Family of Procreation = spouse/children, more direct influence on everyday buying), Roles & Status (people choose products that reflect their role and desired status in society)."},
      {term:'Personal Factors', explanation:"Age & life-cycle stage, Occupation, Economic circumstances (disposable income, savings, borrowing power, attitude to spending), Lifestyle, and Personality (5 brand personalities identified: Sincerity, Excitement, Competence, Sophistication, Ruggedness)."},
      {term:'Psychological Factors', explanation:"Motivation, Perception, Learning, and Beliefs & Attitudes all shape how a consumer processes marketing stimuli and forms a purchase decision."},
      {term:'Types of Buying Behaviour', explanation:"Based on involvement level and brand differences: **Complex Buying Behaviour** (high involvement, significant brand differences — e.g. a car), **Dissonance-Reducing Buying Behaviour** (high involvement, few brand differences — e.g. carpet), **Habitual Buying Behaviour** (low involvement, few differences — e.g. salt), **Variety-Seeking Buying Behaviour** (low involvement, significant differences — e.g. switching snack brands just for variety)."},
      {term:'The Buyer Decision Process', explanation:"Problem/Need Recognition → Information Search → Evaluation of Alternatives → Purchase Decision → Post-purchase Behaviour."},
      {term:'New Product Adoption', explanation:"Adoption stages: Awareness → Interest → Evaluation → Trial → Adoption. Adopter categories (fastest to slowest): Innovators (venturesome risk-takers), Early Adopters (careful opinion leaders), Early Majority, Late Majority (skeptical, wait for the majority), Laggards (tradition-bound, adopt last). Rate of adoption is influenced by: Relative Advantage, Compatibility, Complexity, Divisibility, Communicability."},
    ],
    examples:[
      "A person's 'Family of Orientation' (parents, siblings) shapes their sense of religion and self-worth, while their 'Family of Procreation' (spouse, children) more directly shapes everyday grocery buying.",
      "Buying table salt (low involvement, brands barely differ) is Habitual Buying Behaviour; buying a car (high involvement, brands differ a lot) is Complex Buying Behaviour.",
      "A consumer moving through Awareness → Interest → Evaluation → Trial → Adoption when deciding whether to switch to a new UPI payment app.",
      "'Innovators' try a new food-delivery app at some risk when it first launches; 'Laggards' only start using it once almost everyone else already has.",
    ],
    revision:[
      '4 factor groups: Cultural, Social, Personal, Psychological.',
      'Reference groups: Membership, Primary/Secondary, Aspirational, Dissociative.',
      'Family of Orientation (parents) vs Family of Procreation (spouse/children).',
      'Buying behaviour types: Complex (high inv./high diff.), Dissonance-Reducing (high inv./low diff.), Habitual (low inv./low diff.), Variety-Seeking (low inv./high diff.).',
      'Buyer Decision Process: Problem Recognition → Info Search → Evaluate Alternatives → Purchase → Post-purchase.',
      'Adoption Process: Awareness → Interest → Evaluation → Trial → Adoption.',
      'Adopters (fast→slow): Innovators, Early Adopters, Early Majority, Late Majority, Laggards.',
      '5 factors affecting adoption rate: Relative Advantage, Compatibility, Complexity, Divisibility, Communicability.',
    ]
  }, [
    {difficulty:'easy', q:"Consumer Buying Behaviour is best defined as:", options:["Only the act of paying for a product","The process and activities people engage in when searching, selecting, purchasing, using, evaluating and disposing of products/services to satisfy needs and wants","The advertising strategy of a company","The pricing strategy for a new product"], correct:1,
      why:"Consumer buying behaviour covers the FULL process — searching, selecting, purchasing, using, evaluating and disposing — not just the moment of payment.",
      whyNot:{0:"Paying is only one small part of the overall buying process.",2:"Advertising strategy is something the COMPANY does, not the buying behaviour of the CONSUMER.",3:"Pricing strategy is also a company-side decision, not consumer behaviour."}},
    {difficulty:'easy', q:"Which of the following is a CULTURAL factor affecting consumer behaviour?", options:["Motivation","Family","Social Class","Personality"], correct:2,
      why:"Social Class is one of the three Cultural factors covered (along with Culture and Subculture), representing hierarchically ordered strata in society.",
      whyNot:{0:"Motivation is a Psychological factor, not a Cultural one.",1:"Family is a Social factor, not a Cultural one.",3:"Personality is a Personal factor, not a Cultural one."}},
    {difficulty:'moderate', q:"In India, marketers often use the Socio-Economic Classification (SEC) system, where which category signifies the HIGHEST purchase potential in urban areas?", options:["E2","C","A1","R1"], correct:2,
      why:"In the SEC system, A1 signifies the highest purchase potential among urban households, with the scale descending down to E2.",
      whyNot:{0:"E2 is at the LOWEST end of purchase potential in the SEC scale, not the highest.",1:"C is a mid-range category, not the highest.",3:"R1 is the highest RURAL category (using R1-R4), not the urban A1-E2 scale."}},
    {difficulty:'moderate', q:"A person's orientation towards religion, politics and a sense of personal ambition is primarily shaped by their:", options:["Family of Procreation","Family of Orientation","Reference group","Aspirational group"], correct:1,
      why:"The Family of Orientation — one's parents and siblings — is specifically where a person acquires their orientation towards religion, politics, economics, and sense of personal ambition and self-worth.",
      whyNot:{0:"Family of Procreation (spouse/children) has more direct influence on everyday buying behaviour, not core life orientations.",2:"A reference group influences specific attitudes/behaviours, but the material specifically attributes these core orientations to family.",3:"An aspirational group is one a person wants to belong to, not their formative family influence."}},
    {difficulty:'moderate', q:"Buying salt or other routine, low-cost, low-involvement products with minimal brand differences is an example of:", options:["Complex Buying Behaviour","Dissonance-Reducing Buying Behaviour","Habitual Buying Behaviour","Variety-Seeking Buying Behaviour"], correct:2,
      why:"Habitual Buying Behaviour occurs with low involvement and few perceived brand differences — exactly the case with something routine like salt.",
      whyNot:{0:"Complex Buying Behaviour requires HIGH involvement and significant brand differences, unlike buying salt.",1:"Dissonance-Reducing Behaviour requires high involvement (even if brand differences are low), unlike this low-involvement purchase.",3:"Variety-Seeking Behaviour requires significant brand differences, which salt typically lacks."}},
    {difficulty:'moderate', q:"A consumer buys an expensive car (high involvement) where brands differ significantly in features and reputation, and spends considerable time gathering information. This is:", options:["Habitual Buying Behaviour","Complex Buying Behaviour","Variety-Seeking Buying Behaviour","Dissonance-Reducing Buying Behaviour"], correct:1,
      why:"High involvement combined with significant brand differences (as with a car) is the definition of Complex Buying Behaviour.",
      whyNot:{0:"Habitual behaviour involves LOW involvement, unlike this high-involvement car purchase.",2:"Variety-Seeking involves LOW involvement, unlike this scenario.",3:"Dissonance-Reducing behaviour applies when brands DON'T differ much, unlike a car where features/reputation differ significantly."}},
    {difficulty:'moderate', q:"In the 5-stage Buyer Decision Process, which stage comes immediately AFTER 'Information Search'?", options:["Problem Recognition","Evaluation of Alternatives","Purchase Decision","Post-purchase Behaviour"], correct:1,
      why:"The sequence is Problem Recognition → Information Search → Evaluation of Alternatives → Purchase Decision → Post-purchase Behaviour, so Evaluation of Alternatives directly follows Information Search.",
      whyNot:{0:"Problem Recognition comes BEFORE Information Search, not after it.",2:"Purchase Decision comes two steps later, after Evaluation of Alternatives.",3:"Post-purchase Behaviour is the final stage, coming after the purchase itself."}},
    {difficulty:'moderate', q:"In the New Product Adoption Process, the stage where a consumer tries a new product on a small scale to assess its value is called:", options:["Awareness","Interest","Trial","Adoption"], correct:2,
      why:"The Trial stage is specifically when the consumer tries the new product on a small scale to improve their estimate of its value, before committing fully.",
      whyNot:{0:"Awareness is simply becoming aware the product exists, without trying it.",1:"Interest is seeking more information, still before any trial.",3:"Adoption is the FINAL stage — deciding to make full, regular use — which comes after the trial, not during it."}},
    {difficulty:'difficult', q:"A consumer group that is highly skeptical of change and only adopts an innovation once it has become 'something of a tradition itself' is best classified as:", options:["Innovators","Early Majority","Late Majority","Laggards"], correct:3,
      why:"Laggards are described as traditional-bound, suspicious of change, and only adopting an innovation once it has effectively become a tradition itself — the very last group to adopt.",
      whyNot:{0:"Innovators are venturesome and try new ideas at some risk — the opposite of this description.",1:"Early Majority adopt just ahead of the average person, well before laggards.",2:"Late Majority adopt only after a majority has already tried it, but are not as extreme as laggards, who wait until it's essentially a tradition."}},
    {difficulty:'difficult', q:"A new mobile payment app is very easy to understand, clearly better than cash, can be tried with a small transaction first, and is easy to explain to friends. According to the 5 product characteristics influencing rate of adoption, this app scores well on:", options:["Only Relative Advantage","Relative Advantage, Compatibility/low Complexity, Divisibility and Communicability","Only Complexity","None of these characteristics apply to services"], correct:1,
      why:"The app is 'clearly better than cash' (Relative Advantage), 'easy to understand' (low Complexity), 'can be tried with a small transaction' (Divisibility), and 'easy to explain to friends' (Communicability) — it scores well across multiple adoption-rate factors, not just one.",
      whyNot:{0:"The scenario describes more than just relative advantage — several other factors are also present.",2:"The scenario shows LOW complexity (easy to understand), which favours adoption, not the presence of complexity alone.",3:"These 5 characteristics apply to any innovation, including apps/services, not only physical products."}},
  ]);

  /* ===================== CH5: Customer-Driven Marketing Strategy (STP) ===================== */
  setCh('ch5', {
    overview: "**STP — Segmentation, Targeting, Positioning** — is how a company moves from a broad, undifferentiated market to a focused, customer-driven marketing strategy. It's followed by **Differentiation** (building real, valued distinctiveness) and, increasingly, **Mass Customization** (delivering individualized offerings at near mass-production efficiency).",
    concepts:[
      {term:'Consumer Market Segmentation Bases', explanation:"Geographic (nations/states/cities), Demographic (age, gender, income, occupation etc.), Psychographic (social class, lifestyle, personality), Behavioral (occasions, benefits sought, user status, user rate, readiness stage)."},
      {term:'Business Market Segmentation Bases', explanation:"Demographic (industry, company size), Operating Variables (technology, user status), Purchasing Approaches (centralized vs decentralized, leasing vs outright purchase), Company Characteristics (risk attitude, supplier loyalty)."},
      {term:'Requirements of Effective Segmentation', explanation:"Measurable (size/purchasing power can be measured), Accessible (can be effectively reached/served), Substantial (large enough to be worth a tailored programme), Differentiable (conceptually distinct, responds differently to marketing mix), Actionable (effective programmes CAN be designed for it)."},
      {term:'Targeting Strategies', explanation:"Undifferentiated/Mass Marketing (one offer for the whole market — broad, less popular today), Differentiated Marketing (separate offers for several segments — deeper reach), Concentrated/Niche Marketing (one specialized segment — good when resources are limited), Micro/Local/Individual Marketing (tailored to individuals or very small groups)."},
      {term:'Positioning & Value Proposition', explanation:"Product position exists in the CUSTOMER'S MIND, not on the store shelf. Steps: identify possible competitive advantages, choose the right one(s), craft a value proposition, develop a positioning statement. The Value Proposition Matrix maps combinations like 'More for More', 'More for the Same', 'More for Less', 'Same for Less', and 'Less for Much Less'."},
      {term:'Competitive Frame of Reference, POD & POP', explanation:"Competitive Frame of Reference = which brands you compete with, seen from an Industry perspective (similar products) or Market perspective (same underlying need — avoiding marketing myopia). Points-of-Difference (POD) = attributes strongly, uniquely and positively associated with a brand (must be Desirable, Deliverable, and Differentiating). Points-of-Parity (POP) = associations shared with other brands, not unique."},
      {term:'Differentiation & Mass Customization', explanation:"Differentiation = adding meaningful, valued differences via Product (design, features, durability), Services, Personnel, or Image variables. Mass Customization = producing individually tailored goods/services with near mass-production efficiency, via 4 approaches: **Adaptive** (standard product, customer modifies it post-purchase), **Cosmetic** (same product, different packaging/presentation), **Transparent** (customized using data, without explicitly asking), **Collaborative** (company works directly with the customer to design/configure the product)."},
    ],
    examples:[
      "McDonald's adapting its menu locally (McAloo Tikki, no beef) is Geographic Segmentation in action.",
      "HUL selling Surf, Wheel and Rin as separate detergent brands for different segments is Differentiated Marketing.",
      "Savlon, entering a market where Dettol's strong smell and stinging sensation had become 'category properties' (POPs), advertised its own superior efficacy and 'no-sting' property as a new Point-of-Difference.",
      "BigBasket/Blinkit recommending products based on your past orders (without asking) is Transparent Customization; CaratLane designing custom jewellery with you is Collaborative Customization.",
    ],
    revision:[
      'Consumer segmentation: Geographic, Demographic, Psychographic, Behavioral.',
      'Effective segmentation: Measurable, Accessible, Substantial, Differentiable, Actionable.',
      'Targeting: Undifferentiated, Differentiated, Concentrated/Niche, Micro/Individual.',
      'Positioning = in the mind of the customer, not on the shelf.',
      'POD = unique, desirable, deliverable, differentiating. POP = shared with competitors, not unique.',
      '4 Mass Customization types: Adaptive, Cosmetic, Transparent, Collaborative.',
    ]
  }, [
    {difficulty:'easy', q:"Dividing a market into groups based on nations, states, regions or cities is called:", options:["Demographic Segmentation","Geographic Segmentation","Psychographic Segmentation","Behavioral Segmentation"], correct:1,
      why:"Geographic Segmentation divides a market by geographical units such as nations, states, regions, counties or cities.",
      whyNot:{0:"Demographic segmentation uses variables like age, gender and income, not geography.",2:"Psychographic segmentation uses lifestyle/personality/social class, not geography.",3:"Behavioral segmentation uses occasions, benefits and user status, not geography."}},
    {difficulty:'easy', q:"Segmenting a market based on lifestyle, personality or social class is called:", options:["Geographic Segmentation","Demographic Segmentation","Psychographic Segmentation","Behavioral Segmentation"], correct:2,
      why:"Psychographic Segmentation specifically divides a market based on social class, lifestyle, or personality characteristics.",
      whyNot:{0:"Geographic segmentation uses location, not lifestyle/personality.",1:"Demographic segmentation uses variables like age and income, not psychographic traits.",3:"Behavioral segmentation uses purchase occasions/benefits/usage, not lifestyle or personality."}},
    {difficulty:'moderate', q:"Which of the following is NOT one of the requirements of effective market segmentation?", options:["Measurable","Accessible","Actionable","Expensive"], correct:3,
      why:"The five requirements are Measurable, Accessible, Substantial, Differentiable and Actionable — being 'Expensive' is not a requirement at all, and in fact works against effective segmentation.",
      whyNot:{0:"Measurable IS one of the five requirements.",1:"Accessible IS one of the five requirements.",2:"Actionable IS one of the five requirements."}},
    {difficulty:'moderate', q:"A company that targets an entire market with one offer, with little regard for segment differences, is following:", options:["Differentiated Marketing","Undifferentiated/Mass Marketing","Concentrated/Niche Marketing","Micro Marketing"], correct:1,

    {difficulty:'moderate', q:"HUL selling Surf, Wheel and Rin as separate detergent brands targeting different segments is an example of:", options:["Undifferentiated Marketing","Differentiated Marketing","Concentrated/Niche Marketing","Micro Marketing"], correct:1,
      why:"Offering several distinct brands, each tailored to a different segment, from the same company is a textbook case of Differentiated Marketing.",
      whyNot:{0:"Undifferentiated marketing would mean just ONE offer for everyone, not three distinct brands.",2:"Concentrated/Niche marketing would mean focusing on just ONE narrow segment, not multiple brands across segments.",3:"Micro marketing tailors to individuals, not to a handful of broad brand segments."}},
    {difficulty:'moderate', q:"Product position exists:", options:["On the physical shelf of the store","In the mind of the customer, as their perception of the product","Only in the company's advertising budget","In the company's balance sheet"], correct:1,

    {difficulty:'moderate', q:"An attribute that a brand shares with competing brands, and is not unique to it, is called a:", options:["Point-of-Difference (POD)","Point-of-Parity (POP)","Value Proposition","Competitive Frame of Reference"], correct:1,
      why:"A Point-of-Parity (POP) is an association that is NOT necessarily unique to a brand and may be shared with other brands in the category.",
      whyNot:{0:"A Point-of-Difference (POD) is, by definition, an attribute NOT found to the same extent in competing brands — the opposite of 'shared'.",2:"A value proposition is the overall intangible value offered to customers, not specifically a shared attribute.",3:"Competitive Frame of Reference defines WHICH brands you compete with, not a specific shared attribute."}},
    {difficulty:'moderate', q:"For an attribute to be a valid Point-of-Difference (POD), it must be:", options:["Desirable to consumer, deliverable by company, and differentiating from competitors","Cheap to produce, regardless of customer interest","Identical to what competitors already offer","Kept secret from customers"], correct:0,

    {difficulty:'difficult', q:"Savlon, entering a market dominated by Dettol's strong smell, cloudy liquid and stinging sensation (all seen as category norms), advertised its superior efficacy and 'no-sting' property as key differentiators. This is best described as:", options:["Adopting the same Points-of-Parity as Dettol","Creating a new Point-of-Difference by changing category perception","Undifferentiated/mass marketing","Yield pricing"], correct:1,
      why:"Instead of accepting Dettol's category-defining traits as necessary POPs, Savlon actively challenged the category perception and built a genuine, communicated POD (superior efficacy + no sting) around them.",
      whyNot:{0:"Savlon explicitly did NOT copy Dettol's traits — it countered the category perception instead of adopting the same POPs.",2:"This is a highly targeted differentiation move, the opposite of undifferentiated mass marketing.",3:"Yield pricing concerns charging different prices to manage capacity, unrelated to this positioning strategy."}},
    {difficulty:'difficult', q:"An online grocery app recommends products and personalizes promotions based on a customer's past purchase and browsing history, without the customer explicitly requesting customization. This is an example of:", options:["Adaptive Customization","Cosmetic Customization","Transparent Customization","Collaborative Customization"], correct:2,

    concepts:[

      {term:'Good-Value Pricing & Market-Type Pricing', explanation:"EDLP (Everyday Low Price — constant low price, few discounts) vs High-Low Pricing (higher everyday price, frequent promotions). Pricing also depends on market type: Pure Competition (market sets price), Monopolistic Competition (differentiated features allow price variation), Oligopoly (competitive pricing, no single seller controls it), Pure Monopoly (self-regulated or government-restricted)."},
      {term:'The 6 Steps to Setting Price', explanation:"1) Select the Pricing Objective (Survival, Maximum Current Profit, Maximum Market Share, Maximum Market Skimming, Product-Quality Leadership) 2) Determine Demand (price sensitivity, demand curve, Price Elasticity of Demand) 3) Estimate Costs (Fixed + Variable = Total Cost) 4) Analyze Competitor price-mix 5) Select a Pricing Method (Markup, Perceived-value, Going-rate, Auction-type) 6) Select the Final Price (using a Skimming or Penetration strategy)."},
      {term:'Price Elasticity of Demand & Break-Even', explanation:"Price Elasticity = % change in quantity demanded ÷ % change in price. Inelastic demand (small drop in demand from a price rise) → seller can consider raising price. Elastic demand (large drop from a price rise) → seller can consider lowering price to boost demand. Break-Even Analysis identifies the sales volume at which Total Revenue = Total Cost."},
      {term:'New Product & Product-Mix Pricing Strategies', explanation:"Market-Skimming Pricing (high launch price, lowered over time — electronics) vs Market-Penetration Pricing (low initial price to rapidly build share — Reliance Jio). Product Mix strategies: Product Line Pricing, Optional Product Pricing (accessories), Captive Product Pricing (printer + cartridges), Product Bundle Pricing (TV + home theatre)."},
      {term:'Price Adjustment Strategies & Responding to Price Changes', explanation:"Discount/Allowance, Segmented, Psychological, Promotional, Geographical, Dynamic, and International pricing. When a competitor cuts price, a firm can: match the price, raise perceived value, improve quality and raise price, or launch a low-price 'fighter brand'. **Yield Pricing** charges different prices to different customers to manage capacity and maximize revenue (common in hospitality, transportation, retail); this feeds into the broader **Dynamic Pricing** trend enabled by technology and 24x7 connectivity."},

    {difficulty:'moderate', q:"A company that first assesses customer needs and value perceptions, then sets a target price, and only then determines what costs it can incur, is practising:", options:["Cost-based pricing","Customer value-based pricing","Going-rate pricing","Markup pricing"], correct:1,

  { id:'cs1', title:'BrightBite Toothpaste — Losing Relevance', difficulty:'Moderate',
    topics:['Marketing Myopia','Marketing vs Selling Concept','Customer Value'],
    caseText:`BrightBite is a 40-year-old toothpaste brand that built its reputation purely on "cavity protection." For decades it invested almost all its R&D budget in improving fluoride formulas and manufacturing efficiency, believing that as long as it kept making the same toothpaste cheaper and more available, customers would keep buying.

Over the past five years, competitors have launched toothpastes addressing whitening, sensitivity, gum health, herbal ingredients and breath freshness — reframing the category from "cavity protection" to "complete oral care and confidence." BrightBite's market share has fallen sharply. Its marketing team's response has been to increase advertising spend and offer heavier retailer discounts to push the same product harder, but sales have not recovered. A new CMO has been brought in and has asked you, as a consultant, to diagnose what has gone wrong.`,
    questions:[
      { marks:2, text:'Identify the core problem facing BrightBite.',
        answer:{ issue:'BrightBite has fallen victim to **Marketing Myopia** — it has stayed narrowly focused on its existing product (cavity-protection toothpaste) instead of the evolving customer need (complete oral care and confidence).', concept:'This is a textbook case of Theodore Levitt\'s concept of Marketing Myopia.', keyPoints:['Identifies marketing myopia as the core issue','Notes the narrow product focus vs evolving customer need']}},
      { marks:5, text:'Using the marketing management philosophies covered in class, explain which philosophy BrightBite has been following, and which one it needs to shift toward.',
        answer:{
          issue:"BrightBite has effectively been operating under the **Production concept** (focused on manufacturing efficiency and availability) and, more recently, the **Selling concept** (pushing the same product harder through advertising and discounts) rather than genuinely listening to changing customer needs.",
          concept:"The five marketing management philosophies — Production, Product, Selling, Marketing, and Societal Marketing concepts — describe the different ways companies orient themselves toward the market.",
          explanation:"The Production and Selling concepts are both 'inside-out': they start from what the company already makes and try to push it onto the market. The Marketing concept is 'outside-in': it starts by identifying what the target market actually needs and then designs offerings to satisfy those needs more effectively than competitors.",
          application:"BrightBite's heavier advertising and discounting in response to falling sales is a classic Selling-concept reaction — more push, not more listening — while competitors have already moved to a Marketing-concept approach by researching and addressing whitening, sensitivity and confidence needs.",
          recommendation:"BrightBite should shift to the Marketing concept: research what today's oral-care customer actually values, and redesign its product line (and possibly sub-brands) around those specific needs rather than just promoting the original formula harder.",
          conclusion:"Without this shift, no amount of extra advertising spend will reverse the decline, because the underlying problem is a mismatch between what BrightBite offers and what the market now wants."
        , keyPoints:['Correctly identifies Production/Selling concept as the current approach','Explains inside-out vs outside-in orientation','Recommends a shift to the Marketing concept','Links the recommendation back to the case facts']}},
      { marks:5, text:'What is Marketing Myopia, and how has it specifically caused BrightBite\'s decline?',
        answer:{
          issue:"BrightBite's decline stems directly from Marketing Myopia — a short-sighted, inward-looking approach that focuses on the firm's existing product instead of customer needs.",
          concept:"Theodore Levitt coined this term to describe companies that define their business too narrowly around what they currently sell rather than the broader need they serve.",
          explanation:"Myopic companies often believe growth is guaranteed, assume no real substitute exists for their product, focus on the product instead of the customer, and ignore changing lifestyles — all four of which apply to BrightBite's forty years of focusing solely on cavity protection.",
          application:"By defining itself as 'a cavity-protection toothpaste maker' rather than 'a company that helps people feel confident about their oral health,' BrightBite missed the shift in customer expectations toward whitening, sensitivity and freshness — the same blind spot that hurt Kodak when it dismissed Sony, and later Sony when it dismissed Apple.",
          recommendation:"BrightBite needs to redefine its business around the broader customer need (complete oral confidence) rather than the narrow product category it has always sold.",
          conclusion:"Its declining share is not a promotion problem — it is a definition-of-business problem, which is the essence of marketing myopia."
        , keyPoints:['Defines marketing myopia accurately','Cites at least two of the four causes of myopia','Draws the parallel to a real precedent (Kodak/Sony/Apple) or equivalent reasoning','Connects the concept precisely to BrightBite\'s facts']}},
      { marks:8, text:'As the newly appointed CMO\'s consultant, prepare a detailed turnaround recommendation for BrightBite, covering how it should redefine its philosophy, understand customer value, and rebuild its market position.',
        answer:{
          issue:"BrightBite is a legacy toothpaste brand suffering declining share because it has remained fixated on its original 'cavity protection' positioning and reacted to competition with more advertising and discounting rather than genuine customer-need innovation — a case of both marketing myopia and an outdated Production/Selling-concept orientation.",
          concept:"This turnaround requires applying three linked ideas from marketing management: the five Marketing Management Philosophies, the concept of Marketing Myopia, and the Customer Value equation (Value = Quality + Service, weighed against Price).",
          explanation:"A company using the Marketing concept starts with the customer's need and works backward to product design, instead of starting with the product and pushing it outward. Value-based thinking further requires the company to understand precisely what benefits customers are seeking relative to what they're willing to give up (price, effort, trust) to get them.",
          application:"BrightBite's forty-year-old formula-and-efficiency focus, combined with a reactive selling response to falling sales, shows it never updated its definition of the customer need it serves. Competitors reframed the same category from 'cavity protection' to 'complete oral care and confidence' and captured the value BrightBite left on the table.",
          analysis:"The root cause is not weak advertising execution — it is a strategic definition-of-business problem. Pushing the same undifferentiated product harder, through discounts, actually risks further eroding brand value and profitability without addressing the real gap in customer-perceived value.",
          recommendation:"1. **Redefine the business** around 'oral health and confidence,' not 'cavity protection' alone.\n2. **Segment and re-research the market** to identify unmet needs (whitening, sensitivity, herbal, freshness) using the same psychographic and behavioural tools covered under STP.\n3. **Reformulate the product line** (via product development, per Ansoff's Matrix) to address these needs, potentially as sub-brands or line extensions.\n4. **Rebuild the value proposition** — clearly communicate quality and service improvements, not just price discounts, so customers see genuinely higher value, not just a cheaper version of the same old product.\n5. **Shift marketing philosophy** from Selling-concept push tactics to Marketing-concept, customer-need-led campaigns.",
          conclusion:"BrightBite's problem is not a lack of promotional spend but a failure to evolve its definition of the customer need — correcting this marketing-myopia-driven strategic drift, not simply advertising harder, is what will rebuild its market position."
